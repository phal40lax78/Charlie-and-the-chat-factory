name: publish

# A v* tag publishes that version to the VS Code Marketplace and attaches the
# VSIX - the native panel's exe inside it - to a GitHub release, with the
# panel zipped on its own and SHA256SUMS. It signs in as an Entra app
# through GitHub's own OIDC token - no PAT: Azure DevOps retires global
# PATs on 2026-12-01.
#
# Run by hand, it publishes nothing: it signs in, prints the app's Visual
# Studio profile id - what the publisher's manage page takes as a member -
# and checks that the publisher accepts it. That is spike M1; the setup is in
# docs/marketplace-spec.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    # skipped tests are a run by hand, which publishes nothing
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: windows-latest
    # the federated credential trusts this environment, and nothing else
    environment: marketplace
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      PUBLISHER: redaechan
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      # build.js checks the script's version against package.json; this checks
      # the tag against both, and that the release has notes, before anything
      # leaves the runner
      - name: Tag, version and changelog agree
        if: github.event_name == 'push'
        run: |
          $v = (Get-Content extension/package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$v") { throw "tag $env:TAG is not v$v, the version in extension/package.json" }
          $log = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v)) \S+ ([^\r\n]+)\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no '## $v' section" }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'notes.md'), $m.Groups[2].Value.Trim())
          "RELEASE_TITLE=$env:TAG - $($m.Groups[1].Value.Trim())" >> $env:GITHUB_ENV

      # the native panel test.yml built in this run, with its licence
      # notices; the package carries both (extension/build.js stageBin).
      # Deferred: DEFERRED.md "Signing chatq-overlay.exe"
      - uses: actions/download-artifact@v8
        if: github.event_name == 'push'
        with:
          name: chatq-overlay-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/overlay

      # a tag's package must hold the exe; a run by hand packs what it has
      - name: Package
        working-directory: extension
        env:
          CHATQ_OVERLAY_EXE: ${{ runner.temp }}/overlay/chatq-overlay.exe
          CHATQ_REQUIRE_BIN: ${{ github.event_name == 'push' && '1' || '' }}
        run: npx --yes @vscode/vsce@3 package

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # 499b84ac-... is Azure DevOps, which the Marketplace signs in through
      - name: The app's profile id, for the publisher's members
        run: az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv

      - name: The publisher accepts it
        working-directory: extension
        run: npx --yes @vscode/vsce@3 verify-pat --azure-credential $env:PUBLISHER

      - name: Publish
        if: github.event_name == 'push'
        working-directory: extension
        run: npx --yes @vscode/vsce@3 publish --azure-credential --packagePath (Get-Item *.vsix).FullName

      # the VSIX, and the panel on its own - the exe and its notices zipped -
      # with the SHA256SUMS of both
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:TAG.Substring(1)
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory $out | Out-Null
          $vsix = Get-Item extension/*.vsix
          Copy-Item $vsix.FullName $out
          Compress-Archive -Path (Join-Path $env:RUNNER_TEMP 'overlay/*') -DestinationPath (Join-Path $out "chatq-overlay-$v-x86_64-pc-windows-msvc.zip")
          $sums = Get-ChildItem $out -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          [IO.File]::WriteAllText((Join-Path $out 'SHA256SUMS'), ($sums -join "`n") + "`n")
          gh release create $env:TAG (Get-ChildItem $out -File).FullName --title $env:RELEASE_TITLE --notes-file (Join-Path $env:RUNNER_TEMP 'notes.md')
