name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # publish.yml runs it before a release
  workflow_call:

jobs:
  test:
    # Windows-first: Windows PowerShell 5.1 and PowerShell 7 both ship on the
    # runner. macOS and Linux wait until the Unix branches get a fake CLI of
    # their own (FUTURE_WORK.md).
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        host: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4

      # 5.1 reads a BOM-less .ps1 in the ANSI code page. The runner is en-US,
      # where that never shows, so the rule the code depends on is checked here.
      - name: Scripts are pure ASCII
        if: matrix.host == 'powershell'
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -File -Include *.ps1 | Where-Object {
            [IO.File]::ReadAllBytes($_.FullName) | Where-Object { $_ -gt 127 } | Select-Object -First 1
          }
          if ($bad) { $bad.FullName; exit 1 }

      - name: Extension check
        if: matrix.host == 'powershell'
        run: node tests/extension-check.js

      # the phone's reply page: its WebCrypto held to the reference vector
      # Node's own crypto made, its buttons and link driven under node, and
      # nothing it may load or post but the one text/plain POST (and, since
      # 0.9.0, the GET that reads its answers from the down topic)
      - name: Reply page check
        if: matrix.host == 'powershell'
        run: node tests/reply-page-check.js

      # the same page's board and whole answer: the PC -> phone channel held
      # to the vectors Node's crypto and zlib made, the board drawn and tapped
      # under a fake DOM and a fake ntfy server
      - name: Board page check
        if: matrix.host == 'powershell'
        run: node tests/board-page-check.js

      # the Marketplace package: build.js fills payload/ and refuses a version
      # that is not the script's, a script that is not ASCII, an SVG in the
      # listing; vsce then checks the manifest the Marketplace will read
      - name: Extension package
        if: matrix.host == 'powershell'
        working-directory: extension
        run: npx --yes @vscode/vsce@3 package --out claude-codex-chat-manager.vsix

      # the macOS overlay's JXA: compiled and its pure part driven under node;
      # only a Mac can run the rest (TESTING.md)
      - name: Overlay (macOS panel) check
        if: matrix.host == 'powershell'
        run: node tests/overlay-mac-check.js

      - name: Self-test (${{ matrix.host }})
        shell: pwsh
        run: |
          & ${{ matrix.host }} -NoProfile -ExecutionPolicy Bypass -File tests/run-tests.ps1
          exit $LASTEXITCODE
