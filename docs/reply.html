<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- resizes-content: the on-screen keyboard shrinks the page instead of
     sliding over it, so Send stays just above the keys, under the thumb -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<!-- Nothing loads from anywhere: the only request the page makes is the POST
     to the ntfy server this phone was paired with. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https:; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101217" media="(prefers-color-scheme: dark)">
<!-- an empty icon, so the browser does not ask the host for /favicon.ico -->
<link rel="icon" href="data:,">
<title>chatq reply</title>
<style>
:root {
    --bg: #f4f5f7; --card: #ffffff; --fg: #15171c; --muted: #6a717d; --line: #d5d9e0;
    --accent: #2459d6; --accent-fg: #ffffff; --ok: #177a3b; --warn: #a65b00; --bad: #c0262d;
    --ok-bg: #e6f4ea; --warn-bg: #fff3e0; --bad-bg: #fdeaea; --wait-bg: #e9eef9;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #101217; --card: #1a1d24; --fg: #e9ebef; --muted: #99a0ac; --line: #2e333d;
        --accent: #3f7cf0; --accent-fg: #ffffff; --ok: #5fd08a; --warn: #f2b14c; --bad: #ff7b7f;
        --ok-bg: #16281d; --warn-bg: #2d2412; --bad-bg: #331a1c; --wait-bg: #1b2336;
    }
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body {
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
}
.app, .card {
    display: flex; flex-direction: column; gap: 12px;
    min-height: 100vh; min-height: 100dvh; max-width: 40rem; margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.top { display: flex; flex-direction: column; gap: 6px; }
.line1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 26px; }
.chip {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
    letter-spacing: .01em; color: #fff; background: var(--chip, #6a717d);
}
.chip[data-ev="done"] { --chip: #1f8a4c; }
.chip[data-ev="needs input"] { --chip: #b86e00; }
.chip[data-ev="failed"] { --chip: #c0262d; }
.chip[data-ev="started"] { --chip: #2459d6; }
.chip[data-ev="limited"], .chip[data-ev="overloaded"] { --chip: #b54708; }
.chip[data-ev="test"] { --chip: #6b4fd8; }
.meta { color: var(--muted); font-size: 14px; }
.title {
    margin: 0; font-size: 22px; line-height: 1.3; font-weight: 650;
    word-break: keep-all; overflow-wrap: anywhere;
}
.compose { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; min-height: 9rem; }
textarea {
    flex: 1 1 auto; width: 100%; min-height: 7rem; resize: none;
    font: inherit; font-size: 17px; line-height: 1.45;
    padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
    transition: color .15s;
}
textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea.sent { color: var(--muted); }
.under { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); min-height: 18px; }
.count { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
.count[data-state="warn"] { color: var(--warn); font-weight: 600; }
.count[data-state="over"] { color: var(--bad); font-weight: 700; }
.status {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
    font-size: 15px; background: var(--wait-bg); border-left: 4px solid var(--accent);
}
.status[data-kind="ok"] { background: var(--ok-bg); border-left-color: var(--ok); }
.status[data-kind="bad"] { background: var(--bad-bg); border-left-color: var(--bad); }
.status span { flex: 1 1 auto; }
.status button {
    flex: 0 0 auto; min-height: 40px; padding: 6px 14px; border-radius: 10px; font: inherit; font-weight: 600;
    border: 1px solid var(--bad); background: transparent; color: var(--bad);
}
.log { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); }
.log li { padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.more { display: flex; flex-wrap: wrap; gap: 8px; }
.more button {
    flex: 1 1 0; min-width: 6.5rem; min-height: 44px; padding: 8px 12px;
    font: inherit; font-size: 15px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
}
.more button[data-armed="1"] { border-color: var(--bad); color: var(--bad); font-weight: 600; }
.primary {
    width: 100%; min-height: 56px; padding: 10px 16px; border: 0; border-radius: 16px;
    font: inherit; font-size: 18px; font-weight: 650;
    background: var(--accent); color: var(--accent-fg);
}
button { cursor: pointer; touch-action: manipulation; }
button:active:not(:disabled) { transform: scale(.98); }
button:disabled { opacity: .45; cursor: default; }
/* four small buttons sit two by two rather than three and a lone one */
.more button:first-child:nth-last-child(4), .more button:first-child:nth-last-child(4) ~ button { flex-basis: calc(50% - 4px); }
.fine { margin: 0; text-align: center; font-size: 12px; color: var(--muted); }
.about { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
/* the cards: pairing, not paired, a link that cannot be used. What to read
   sits high, the one button low, where the thumb is */
.card { max-width: 32rem; }
.card-body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 6vh 4px 12px; }
.mark {
    width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
    background: var(--wait-bg); color: var(--accent); margin-bottom: 4px;
}
.mark[data-mark="ok"] { background: var(--ok-bg); color: var(--ok); }
.mark[data-mark="bad"] { background: var(--bad-bg); color: var(--bad); }
.mark svg { width: 30px; height: 30px; display: none; }
.mark[data-mark="pair"] .m-pair, .mark[data-mark="ok"] .m-ok, .mark[data-mark="phone"] .m-phone, .mark[data-mark="bad"] .m-bad { display: block; }
.kicker { margin: 0; color: var(--muted); font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.card h1 { margin: 0; font-size: 25px; line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; }
.card-body p { margin: 0; line-height: 1.5; }
.card-body .say { color: var(--muted); font-size: 16px; }
.code {
    margin: 2px 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere;
    font: 600 17px/1.4 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
    -webkit-user-select: all; user-select: all;
}
/* the pairing code, read off the phone and matched on the PC */
.big {
    margin: 4px 0 2px; padding: 14px 12px; border-radius: 16px; text-align: center;
    background: var(--card); border: 1px solid var(--line); color: var(--fg);
    font: 700 46px/1.1 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
    letter-spacing: .08em; font-variant-numeric: tabular-nums; white-space: pre;
    -webkit-user-select: all; user-select: all;
}
.primary[data-armed="1"] { background: var(--bad); }
.warn { padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); border-left: 4px solid var(--warn); font-size: 15px; }
.card-foot { display: flex; flex-direction: column; gap: 10px; }
/* the keyboard is up (or the screen is small): only what sending needs, the
   small buttons in one row, so Send stays on screen above the keys */
@media (max-height: 520px) {
    .app { gap: 8px; padding-top: max(8px, env(safe-area-inset-top)); }
    .log, .app .fine, .about { display: none; }
    .title { font-size: 18px; }
    .compose { min-height: 0; }
    textarea { min-height: 4.5rem; }
    .actions { gap: 8px; }
    .more { flex-wrap: nowrap; gap: 6px; }
    .more button, .more button:first-child:nth-last-child(4), .more button:first-child:nth-last-child(4) ~ button {
        flex: 1 1 0; min-width: 0; min-height: 40px; padding: 4px 6px; font-size: 14px; line-height: 1.2;
    }
    .primary { min-height: 50px; }
    .card-body { padding-top: 8px; }
}
.broken { max-width: 30rem; margin: 0 auto; padding: 18vh 24px 24px; text-align: center; }
.broken h1 { font-size: 21px; margin: 0 0 10px; }
.broken p { margin: 0 auto; color: var(--muted); line-height: 1.5; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main id="app" class="app" hidden>
    <header class="top">
        <div class="line1"><span id="ev" class="chip"></span><span id="meta" class="meta"></span></div>
        <h1 id="title" class="title"></h1>
    </header>
    <div id="compose" class="compose">
        <label for="text" class="sr">Message to the chat</label>
        <textarea id="text" autofocus rows="5" autocapitalize="sentences" autocomplete="off"></textarea>
        <div class="under"><span id="hint"></span><span id="count" class="count"></span></div>
    </div>
    <p id="about" class="about" hidden></p>
    <div id="status" class="status" role="status" aria-live="polite" hidden><span id="statusText"></span><button id="again" type="button" hidden>Try again</button></div>
    <ol id="log" class="log"></ol>
    <footer class="actions">
        <div id="more" class="more"></div>
        <button id="send" class="primary" type="button"></button>
        <p id="fine" class="fine"></p>
    </footer>
</main>
<section id="card" class="card" hidden>
    <div class="card-body">
        <div id="mark" class="mark" aria-hidden="true">
            <svg class="m-pair" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
            <svg class="m-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            <svg class="m-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18h2"/></svg>
            <svg class="m-bad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5v.01"/></svg>
        </div>
        <p id="kicker" class="kicker" hidden></p>
        <h1 id="cardHead"></h1>
        <p id="cardBig" class="big" hidden></p>
        <p id="cardBody" class="say"></p>
        <p id="cardCode" class="code" hidden></p>
        <p id="cardAfter" class="say" hidden></p>
        <p id="cardWarn" class="warn" hidden></p>
    </div>
    <footer class="card-foot">
        <div id="cardStatus" class="status" role="status" aria-live="polite" hidden><span id="cardStatusText"></span></div>
        <button id="pair" class="primary" type="button" hidden>Pair</button>
        <p id="cardFine" class="fine" hidden></p>
    </footer>
</section>
<noscript><section class="broken"><h1>This page needs JavaScript</h1><p>It encrypts the reply on the phone before sending it.</p></section></noscript>
<script>
/* chatq-crypto-begin */
// The reply and the pairing on the wire. Pure functions over bytes, so
// tests/reply-page-check.js can lift this block out, run it under Node's
// webcrypto and hold it to tests/fixtures/reply-vector.json and
// pair-vector.json - the files the watcher's PowerShell side is held to as
// well, so the two agree byte for byte.
//
// Pairing: the phone makes its own key D and sends it once, sealed to the
// RSA public key the pairing link carries; the PC takes it only once the user
// confirms there the code this phone shows. From then on an alert's link
// carries no secret at all: the key of one alert is derived here, from D and
// the alert's id, the same way the PC derives it.
var ChatqCrypto = (function () {
    'use strict';
    var encoder = new TextEncoder();
    // RSA-OAEP with SHA-256 on a 2048-bit key seals at most this many bytes
    var MAX_PAIR_PAYLOAD = 190;
    function utf8(s) { return encoder.encode(s); }
    function b64url(bytes) {
        var s = '';
        for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    // null for anything that is not base64url, rather than a guess
    function unb64url(s) {
        if (typeof s !== 'string' || !/^[A-Za-z0-9_-]*$/.test(s) || s.length % 4 === 1) return null;
        var bin;
        try { bin = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '=='.slice(0, (4 - s.length % 4) % 4)); } catch (e) { return null; }
        var out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
    }
    function randomBytes(n) {
        var b = new Uint8Array(n);
        crypto.getRandomValues(b);
        return b;
    }
    // D as the phone keeps it: an HMAC key WebCrypto will sign with but never
    // hand back, so a script on this origin can use it while the page is
    // open but cannot copy it off the phone
    function phoneKey(d) {
        return crypto.subtle.importKey('raw', d, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    }
    // a CryptoKey as it is, or raw bytes
    function isKey(key) {
        return !!key && typeof key === 'object' && typeof key.type === 'string' && !!key.algorithm && !!key.usages;
    }
    async function hmac(key, data) {
        var ck = isKey(key) ? key : await phoneKey(key);
        return new Uint8Array(await crypto.subtle.sign('HMAC', ck, data));
    }
    // the key of one alert, from the phone's key (bytes or the kept
    // CryptoKey, the same k either way): the PC makes the same one
    async function alertKey(d, aid) {
        return hmac(d, utf8('chatq-alert:' + aid));
    }
    // The six digits the user matches between the phone and the PC before
    // the PC takes a pairing answer: the first 4 bytes of HMAC(D,
    // "chatq-confirm") big-endian, mod a million. Anyone who answers a
    // pairing alert in the phone's place holds another D, so another code.
    async function confirmCode(d) {
        var h = await hmac(d, utf8('chatq-confirm'));
        var n = h[0] * 16777216 + h[1] * 65536 + h[2] * 256 + h[3];
        return ('00000' + (n % 1000000)).slice(-6);
    }
    // two keys from the alert's one, so the cipher and the MAC never share a key
    async function deriveKeys(k) {
        return { enc: await hmac(k, utf8('enc')), mac: await hmac(k, utf8('mac')) };
    }
    // key order and spelling are the wire format: JSON.stringify keeps both
    function buildPayload(act, text, nonce, ts) {
        return JSON.stringify({ v: 1, act: act, text: text, nonce: nonce, ts: ts });
    }
    // encrypt-then-MAC: the watcher checks the MAC over everything before
    // it decrypts a byte
    async function sealPayload(k, aid, payload, iv) {
        var keys = await deriveKeys(k);
        var ek = await crypto.subtle.importKey('raw', keys.enc, { name: 'AES-CBC' }, false, ['encrypt']);
        var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-CBC', iv: iv }, ek, utf8(payload)));
        var head = 'chatq1.' + aid + '.' + b64url(iv) + '.' + b64url(ct);
        return head + '.' + b64url(await hmac(keys.mac, utf8(head)));
    }
    // fixed: { iv, nonce, ts } for the test vector; a real send leaves it out
    // and gets a fresh iv and nonce each time, which is what the watcher's
    // replay guard counts on
    async function seal(k, aid, act, text, fixed) {
        fixed = fixed || {};
        var nonce = fixed.nonce !== undefined ? fixed.nonce : b64url(randomBytes(16));
        var ts = fixed.ts !== undefined ? fixed.ts : Date.now();
        var iv = fixed.iv !== undefined ? fixed.iv : randomBytes(16);
        var payload = buildPayload(act, text, nonce, ts);
        return { message: await sealPayload(k, aid, payload, iv), payload: payload, nonce: nonce, ts: ts };
    }
    function buildPairPayload(d, label, ts) {
        return JSON.stringify({ v: 2, d: d, label: label, ts: ts });
    }
    // n and e as the pairing link has them, base64url: exactly a JWK's own
    // spelling, so the key goes in with no parsing of ours
    async function sealPair(n, e, pid, payload) {
        var bytes = utf8(payload);
        if (bytes.length > MAX_PAIR_PAYLOAD) throw new Error('pairing payload over ' + MAX_PAIR_PAYLOAD + ' bytes');
        var pk = await crypto.subtle.importKey('jwk', { kty: 'RSA', n: n, e: e, alg: 'RSA-OAEP-256', ext: true },
            { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
        var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pk, bytes));
        return 'chatq2p.' + pid + '.' + b64url(ct);
    }
    // fixed: { d, ts } for the tests; a real pairing makes a new D
    async function pair(n, e, pid, label, fixed) {
        fixed = fixed || {};
        var d = fixed.d !== undefined ? fixed.d : randomBytes(32);
        var ts = fixed.ts !== undefined ? fixed.ts : Date.now();
        var payload = buildPairPayload(b64url(d), label, ts);
        return { message: await sealPair(n, e, pid, payload), payload: payload, d: d, ts: ts };
    }
    return {
        MAX_PAIR_PAYLOAD: MAX_PAIR_PAYLOAD,
        utf8: utf8, b64url: b64url, unb64url: unb64url, randomBytes: randomBytes, phoneKey: phoneKey, isKey: isKey, hmac: hmac,
        alertKey: alertKey, confirmCode: confirmCode, deriveKeys: deriveKeys, buildPayload: buildPayload, sealPayload: sealPayload, seal: seal,
        buildPairPayload: buildPairPayload, sealPair: sealPair, pair: pair
    };
})();
/* chatq-crypto-end */

/* chatq-logic-begin */
// What the page shows and offers, from the link and what this phone keeps.
// Pure functions too, driven by tests/reply-page-check.js the same way.
var ChatqPage = (function () {
    'use strict';
    // sealed, a payload this size stays under ntfy's 4096-byte message limit
    var MAX_PAYLOAD = 2900;
    // warned from here: room left to trim before Send turns off
    var WARN_AT = 2400;
    var ACTS = ['prompt', 'retry', 'allow', 'skip', 'stop', 'status', 'ping'];
    var LABEL_MAX = 40, HOST_MAX = 30;

    function normEvent(e) {
        return String(e || '').trim().toLowerCase().replace(/[-_\s]+/g, ' ');
    }
    function clean(s, max) {
        return String(s || '').replace(/[\x00-\x1f\x7f]+/g, ' ').trim().slice(0, max);
    }
    // only https: the page is https, and the CSP lets it talk to nothing else
    function serverOf(s) {
        if (!s) return null;
        var u;
        try { u = new URL(s); } catch (e) { return null; }
        if (u.protocol !== 'https:' || u.username || u.password || u.search || u.hash) return null;
        return u.origin + u.pathname.replace(/\/+$/, '');
    }
    function topicOk(t) { return /^[A-Za-z0-9_-]{1,64}$/.test(t || ''); }
    function idOk(a) { return /^[a-z2-7]{10}$/.test(a || ''); }

    // { ok: true, mode: alert | pair, f } or
    // { ok: false, why: missing | old | version | bad }.
    // Two kinds of link. The pairing link is the one push that carries where
    // replies go (s, t) and the PC's public key (n, x). An alert's link
    // carries no secret and nothing about where to send: k, s and t in one
    // are never read, so a link made up to send this phone's replies
    // elsewhere, or with a key of its own, gets nowhere.
    function parseFragment(hash) {
        var h = String(hash || '').replace(/^#/, '');
        if (!h) return { ok: false, why: 'missing' };
        var q = Object.create(null);
        var parts = h.split('&');
        for (var i = 0; i < parts.length; i++) {
            var eq = parts[i].indexOf('=');
            if (eq < 1) continue;
            var val;
            try { val = decodeURIComponent(parts[i].slice(eq + 1)); } catch (e) { return { ok: false, why: 'bad' }; }
            q[parts[i].slice(0, eq)] = val;
        }
        if (q.v === undefined && q.k === undefined && q.m === undefined && q.a === undefined) return { ok: false, why: 'missing' };
        // v1 put the alert's key in the link; such a link is refused whole
        if (q.v === '1') return { ok: false, why: 'old' };
        if (q.v !== '2') return { ok: false, why: /^[0-9]+$/.test(q.v || '') && +q.v > 2 ? 'version' : 'bad' };
        if (q.m === 'pair') {
            var server = serverOf(q.s);
            var n = /^[A-Za-z0-9_-]+$/.test(q.n || '') ? ChatqCrypto.unb64url(q.n) : null;
            var x = /^[A-Za-z0-9_-]+$/.test(q.x || '') ? ChatqCrypto.unb64url(q.x) : null;
            // 2048 bits at least: the pairing payload is sized for that
            if (!server || !topicOk(q.t) || !idOk(q.a) || !n || n.length < 256 || n.length > 512 || !x || x.length < 1 || x.length > 8) {
                return { ok: false, why: 'bad' };
            }
            return { ok: true, mode: 'pair', f: { server: server, topic: q.t, pid: q.a, n: q.n, e: q.x, host: clean(q.h, HOST_MAX) } };
        }
        if (q.m !== undefined) return { ok: false, why: 'version' };
        if (!idOk(q.a)) return { ok: false, why: 'bad' };
        return {
            ok: true,
            mode: 'alert',
            f: {
                aid: q.a,

    // somewhere to keep the key: IndexedDB, else localStorage
    async function canKeep() {
        if ((await dbDo('readonly', function (st) { return st.get(DB_KEY); })).ok) return true;
        try {
            localStorage.setItem(PHONE + '-probe', '1');
            localStorage.removeItem(PHONE + '-probe');
            return true;
        } catch (e) { return false; }
    }

    // Replacing a pairing the phone has takes a second, deliberate tap (as
    // Skip and Stop do): one tap on a link someone made up would send every
    // later reply to them
    function pairArmed(btn) {
        var ask = btn.getAttribute('data-confirm');
        if (!ask) return true;
        if (btn.getAttribute('data-armed') === '1') {
            if (Date.now() - armedAt < CONFIRM_MS) return false;
            btn.removeAttribute('data-armed');
            return true;
        }
        btn.setAttribute('data-armed', '1');
        armedAt = Date.now();
        btn.textContent = ask;
        setTimeout(function () {
            if (btn.getAttribute('data-armed') !== '1' || busy) return;
            btn.removeAttribute('data-armed');
            btn.textContent = btn.getAttribute('data-label');
        }, 5000);
        return false;
    }

    // The tap that pairs. The key is kept only once the POST has gone
    // through: kept before, a failed send would leave the phone holding a key
    // the PC never saw. Try again sends the very same sealed message (the
    // same key), because the first one may have arrived after all - a new key
    // then would be one the PC does not have. Once kept, the raw bytes are
    // dropped: IndexedDB holds a key that signs and never exports.
    async function pairNow() {
        if (busy || mode !== 'pair') return;
        var btn = $('pair');
        if (!pairing && !pairArmed(btn)) return;
        busy = true;
        btn.disabled = true;
        btn.textContent = 'Pairing\u2026';
        cardStatus('wait', 'Sending\u2026');
        if (!pairing) {
            // nowhere to keep the key: said before anything is sent
            if (!(await canKeep())) {
                busy = false;
                card('storage', {});
                return settle();
            }
            try {
                pairing = await C.pair(pf.n, pf.e, pf.pid, P.deviceLabel(navigator.userAgent));
            } catch (e) {
                busy = false;
                btn.disabled = false;
                btn.textContent = btn.getAttribute('data-label');
                cardStatus('bad', 'This browser could not seal the key.');
                return settle();
            }
        }
        var r = await post(P.postUrl(pf), pairing.message);
        if (!r.ok) {
            busy = false;
            btn.disabled = false;
            btn.textContent = 'Try again';
            cardStatus('bad', P.errorText(r, P.hostOf(pf.server)));
            return settle();
        }
        var at = Date.now(), kept = null;
        try { kept = await keepInDb(pf, pairing.d, at); } catch (e) { }
        if (!kept) {
            // no IndexedDB here: the v2 way, and the page says what it means
            try {
                localStorage.setItem(PHONE, P.phoneRecord(pf, pairing.d, at));
                kept = await readable(P.parsePhone(lget(PHONE)));
            } catch (e) { kept = null; }
        }
        pairing.d.fill(0);
        pairing = null;
        busy = false;
        if (!kept) {
            card('storage', {});
            return settle();
        }
        phone = kept;
        mode = null;
        // the pairing link is spent; a newer link that came meanwhile stays
        if (!reinit) stripBar();
        card('paired', { pf: pf, phone: phone });
        cardStatus('ok', 'Sent - paired once the PC confirms the code.');
        settle();
    }

    // --- the reply form -------------------------------------------------------

    function draftKey() { return DRAFT + f.aid; }
    // what was typed for this alert, and the sealed prompt not yet known to
    // have arrived (ciphertext only), so a reload or a discarded tab loses
    // neither
    function saveDraft() {
        if (mode !== 'alert' || !spec.text) return;
        var sealed = pending && pending.b.act === 'prompt' ? { text: pending.text, message: pending.message } : null;
        sset(draftKey(), JSON.stringify({ text: $('text').value, sealed: sealed }));
    }
    function readDraft() {
        try { var d = JSON.parse(sget(draftKey()) || 'null'); return d && typeof d.text === 'string' ? d : null; } catch (e) { return null; }
    }

    function render() {
        var head = P.heading(f);
        $('card').hidden = true;
        $('app').hidden = false;
        document.title = head + ' - chatq';
        $('title').textContent = head;
        var ev = $('ev');
        ev.textContent = f.event || 'alert';
        ev.setAttribute('data-ev', f.event);
        var meta = [];
        if (f.provider) meta.push(f.provider);
        if (f.job === 'live') meta.push('a chat you run');
        else if (f.job && P.normEvent(f.job) !== f.event) meta.push('job ' + f.job);
        $('meta').textContent = meta.join(' \u00b7 ');
        $('compose').hidden = !spec.text;
        $('hint').textContent = spec.hint;
        $('about').textContent = spec.about;
        $('about').hidden = !spec.about;
        $('fine').textContent = 'To ' + (phone.host ? 'chatq on ' + phone.host : 'your PC') + '. Encrypted on this phone; ' + P.hostOf(phone.server) + ' only passes it on.';
        $('status').hidden = true;
        $('again').hidden = true;
        $('log').textContent = '';
        var ta = $('text');
        ta.placeholder = spec.placeholder;
        ta.value = '';
        if (spec.text) {
            var d = readDraft();
            if (d) {
                ta.value = d.text;
                if (d.sealed && typeof d.sealed.message === 'string' && d.sealed.text === d.text.trim()) {
                    pending = { message: d.sealed.message, b: spec.send, btn: $('send'), text: d.sealed.text };
                }
            }
        }
        var more = $('more');
        more.textContent = '';
        spec.more.forEach(function (b) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.setAttribute('data-act', b.act);
            btn.setAttribute('data-label', b.label);
            btn.textContent = b.label;
            btn.addEventListener('click', function () { press(b, btn); });
            more.appendChild(btn);
        });
        more.hidden = !spec.more.length;
        var send = $('send');
        send.setAttribute('data-act', spec.send.act);
        send.setAttribute('data-label', spec.send.label);
        if (pending) show('bad', 'Not known to have arrived. Try again sends the very same message; the PC drops a second copy.', true);
        refresh();
        if (spec.text) {
            try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); }
        }
    }

    // a failed send of this same act and text is waiting to go again
    function retrying(act, text) {
        return !!pending && pending.b.act === act && pending.text === text;
    }

    // the counter, and the big button's label and state, from the text now
    function refresh() {
        if (!spec) return;
        var send = $('send');
        if (!spec.text) {
            if (!busy) send.textContent = retrying(spec.send.act, '') ? 'Try again' : spec.send.label;
            send.disabled = busy;
            return;
        }
        var ta = $('text');
        var text = ta.value.trim();
        var c = P.counter(text);
        var count = $('count');
        count.textContent = c.label;
        count.setAttribute('data-state', c.state);
        // what was just sent stays readable, greyed, until it is changed
        var same = sentText !== null && text === sentText;
        ta.classList.toggle('sent', same);
        if (!busy) send.textContent = retrying('prompt', text) ? 'Try again' : same ? 'Send again' : spec.send.label;
        send.disabled = busy || !text || c.state === 'over';
    }

    function buttons() {
        return Array.prototype.slice.call($('more').querySelectorAll('button')).concat([$('send')]);
    }

    function setBusy(on, which) {
        busy = on;
        buttons().forEach(function (b) {
            b.disabled = on;
            if (on && b === which) b.textContent = 'Sending\u2026';
            if (!on && b.id !== 'send') b.textContent = b.getAttribute('data-label');
        });
        $('app').setAttribute('aria-busy', on ? 'true' : 'false');
        refresh();
    }

    // Skip and Stop cannot be taken back: the first tap asks, the second
    // acts - but only a deliberate second tap, not one within CONFIRM_MS
    function armed(b, btn) {
        if (!b.confirm) return true;
        if (btn.getAttribute('data-armed') === '1') {
            if (Date.now() - (btn._armedAt || 0) < CONFIRM_MS) return false;
            clearTimeout(btn._disarm);
            btn.removeAttribute('data-armed');
            return true;
        }
        btn.setAttribute('data-armed', '1');
        btn._armedAt = Date.now();
        btn.textContent = b.confirm;
        btn._disarm = setTimeout(function () {
            btn.removeAttribute('data-armed');
            if (!busy) btn.textContent = b.label;
        }, 3000);
        return false;
    }

    function show(kind, text, canRetry) {
        var s = $('status');
        s.setAttribute('data-kind', kind);
        $('statusText').textContent = text;
        $('again').hidden = !canRetry;
        s.hidden = false;
    }

    async function press(b, btn) {
        if (busy || mode !== 'alert') return;
        if (!armed(b, btn)) return;
        var text = b.act === 'prompt' ? $('text').value.trim() : '';
        if (b.act === 'prompt' && (!text || P.counter(text).state === 'over')) return;
        // The same act and text as a send that failed: the same sealed
        // message again, not a new one. If the first did arrive after all,
        // its nonce is spent and the watcher drops the copy; a new seal would
        // get past that and run the prompt twice.
        if (retrying(b.act, text)) {
            pending.btn = btn;
            return deliver();
        }
        setBusy(true, btn);
        var sealed;
        try {
            sealed = await C.seal(await C.alertKey(phone.key, f.aid), f.aid, b.act, text);
        } catch (e) {
            setBusy(false);
            show('bad', P.errorText({ kind: 'crypto' }, P.hostOf(phone.server)), false);
            return settle();
        }
        pending = { message: sealed.message, b: b, btn: btn, text: text };
        saveDraft();
        return deliver();
    }

    async function deliver() {
        var p = pending;
        if (!p) return;
        setBusy(true, p.btn);
        show('wait', 'Sending\u2026', false);
        var r = await post(P.postUrl(phone), p.message);
        setBusy(false);
        if (!r.ok) {
            show('bad', P.errorText(r, P.hostOf(phone.server)), true);
            refresh();
            return settle();
        }
        pending = null;
        if (p.b.act === 'prompt') {
            sentText = p.text;
            sdel(draftKey());
        } else {
            saveDraft();
        }
        log(p);
        show('ok', P.sentText(p.b), false);
        refresh();
        // the keyboard down, so the confirmation is what shows
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        settle();
    }

    // A new link that came while a POST was out waits for it: resetting then
    // would lose whether the message arrived, and a Try again with it
    function settle() {
        if (reinit && !busy) init();
    }

    // Content-Type text/plain and no other header: a CORS simple request, so
    // no preflight - one round trip on a phone's network
    function post(url, body) {
        var ctl = typeof AbortController === 'function' ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: body,
            mode: 'cors',
            credentials: 'omit',
            cache: 'no-store',
            referrerPolicy: 'no-referrer',
            signal: ctl ? ctl.signal : undefined
        }).then(function (res) {
            return res.ok ? { ok: true } : { ok: false, kind: 'http', status: res.status };
        }, function (e) {
            return { ok: false, kind: e && e.name === 'AbortError' ? 'timeout' : 'network' };
        }).then(function (r) {
            clearTimeout(timer);
            return r;
        });
    }

    function log(p) {
        var now = new Date();
        var hhmm = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
        var what = p.b.act === 'prompt' ? '"' + (p.text.length > 60 ? p.text.slice(0, 60) + '\u2026' : p.text) + '"' : p.b.label;
        var li = document.createElement('li');
        li.textContent = hhmm + '  sent ' + what;
        var ol = $('log');
        ol.insertBefore(li, ol.firstChild);
        while (ol.children.length > 3) ol.removeChild(ol.lastChild);
    }

    $('send').addEventListener('click', function () { if (spec) press(spec.send, $('send')); });
    $('again').addEventListener('click', function () { if (!busy) deliver(); });
    $('pair').addEventListener('click', function () { pairNow(); });
    $('text').addEventListener('input', function () {
        // an edited text is a new message: Try again would send the old one
        if (pending && pending.b.act === 'prompt' && pending.text !== $('text').value.trim()) {
            pending = null;
            $('again').hidden = true;
        }
        saveDraft();
        refresh();
    });
    $('text').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && spec && !$('send').disabled) {
            e.preventDefault();
            press(spec.send, $('send'));
        }
    });
    // a second alert's link opened in this same tab changes only the fragment
    window.addEventListener('hashchange', function () {
        if (location.hash.length <= 1) return;
        if (busy) { reinit = true; return; }
        init();
    });
    init();
})();
</script>
</body>
</html>
