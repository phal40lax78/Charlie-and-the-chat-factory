<link rel="icon" href="data:,">
<title>chatq reply</title>
<style>

.card-body p { margin: 0; line-height: 1.5; }

    background: var(--card); color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere;
    font: 600 17px/1.4 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
    -webkit-user-select: all; user-select: all;
}
/* the pairing code, read off the phone and matched on the PC */
.big {
    margin: 4px 0 2px; padding: 14px 12px; border-radius: 16px; text-align: center;
    background: var(--card); border: 1px solid var(--line); color: var(--fg);
    font: 700 46px/1.1 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
    letter-spacing: .08em; font-variant-numeric: tabular-nums; white-space: pre;
    -webkit-user-select: all; user-select: all;
}
.primary[data-armed="1"] { background: var(--bad); }
.warn { padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); border-left: 4px solid var(--warn); font-size: 15px; }
.card-foot { display: flex; flex-direction: column; gap: 10px; }
/* the keyboard is up (or the screen is small): only what sending needs, the
   small buttons in one row, so Send stays on screen above the keys */
@media (max-height: 520px) {
    .app { gap: 8px; padding-top: max(8px, env(safe-area-inset-top)); }
    .log, .app .fine, .about { display: none; }
    .title { font-size: 18px; }
    .compose { min-height: 0; }
    textarea { min-height: 4.5rem; }
    .actions { gap: 8px; }
    .more { flex-wrap: nowrap; gap: 6px; }
    .more button, .more button:first-child:nth-last-child(4), .more button:first-child:nth-last-child(4) ~ button {
        flex: 1 1 0; min-width: 0; min-height: 40px; padding: 4px 6px; font-size: 14px; line-height: 1.2;
    }
    .primary { min-height: 50px; }
    .card-body { padding-top: 8px; }
}
.broken { max-width: 30rem; margin: 0 auto; padding: 18vh 24px 24px; text-align: center; }
.broken h1 { font-size: 21px; margin: 0 0 10px; }
.broken p { margin: 0 auto; color: var(--muted); line-height: 1.5; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* The board: the overlay on the phone, in the overlay's own colours -

   title first, the state on the right, what to tap the whole row. */
:root {
    --amber: #a86200; --green: #177a3b; --orange: #c2410c; --purple: #6446cc; --idle: #7a818c; --blue: #2459d6;
    --row: #ffffff; --soft: #eceef2; --bar: #d8dce3;
}
@media (prefers-color-scheme: dark) {
    :root {
        --amber: #f2b14c; --green: #5fd08a; --orange: #ff8f57; --purple: #b39cff; --idle: #8d949f; --blue: #6fa0ff;
        --row: #1a1d24; --soft: #242832; --bar: #2e333d;
    }
}
.board, .chat {
    display: flex; flex-direction: column; gap: 10px;
    min-height: 100vh; min-height: 100dvh; max-width: 40rem; margin: 0 auto;
    padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
}
.bhead { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 4px 0 8px; border-bottom: 1px solid var(--line); }
.brow { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.bhost { flex: 1 1 auto; min-width: 0; font-size: 17px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btime { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.ghost, .linkish {
    min-height: 36px; padding: 4px 12px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600;
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
}
.linkish { border-color: transparent; background: transparent; color: var(--accent); padding: 4px 6px; }
.usage { display: grid; grid-template-columns: max-content max-content minmax(3rem, 1fr) max-content; gap: 3px 8px; align-items: center; font-size: 13px; }
.usage .un { font-weight: 650; }

.usage .stale { opacity: .6; }
.usage progress { -webkit-appearance: none; appearance: none; width: 100%; height: 7px; border: 0; border-radius: 4px; background: var(--bar); color: var(--green); }
.usage progress::-webkit-progress-bar { background: var(--bar); border-radius: 4px; }
.usage progress::-webkit-progress-value { background: var(--green); border-radius: 4px; }
.usage progress::-moz-progress-bar { background: var(--green); border-radius: 4px; }

.usage progress[data-tone="bad"]::-webkit-progress-value { background: var(--bad); }
.usage progress[data-tone="bad"]::-moz-progress-bar { background: var(--bad); }
.bnote { margin: 0; padding: 7px 10px; border-radius: 10px; background: var(--warn-bg); color: var(--fg); font-size: 13px; }
.search {
    width: 100%; min-height: 40px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); font: inherit; font-size: 16px;
}
.blist { display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; }
.shead { margin: 10px 2px 0; font-size: 12px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--c, var(--muted)); }
.row {

    border: 0; border-left: 4px solid var(--c, var(--idle)); border-radius: 12px; background: var(--row); color: var(--fg); font: inherit;

[data-sec="waiting"] { --c: var(--amber); }
[data-sec="working"] { --c: var(--green); }
[data-sec="cut"] { --c: var(--orange); }
[data-sec="queue"] { --c: var(--purple); }
[data-sec="idle"] { --c: var(--idle); }

[data-sec="older"] { --c: var(--line); }

.rm { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;

.rs { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tag {
    display: inline-block; max-width: 100%; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 650; line-height: 1.35;
    background: var(--soft); color: var(--tc, var(--muted)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tag[data-tone="waiting"] { --tc: var(--amber); }
.tag[data-tone="working"] { --tc: var(--green); }
.tag[data-tone="queue"] { --tc: var(--purple); }
.tag[data-tone="bad"] { --tc: var(--bad); }
.skel { height: 58px; border-radius: 12px; background: var(--soft); }
.bmore, .bempty { margin: 6px 2px; font-size: 13px; color: var(--muted); }

.blisten { flex: 1 1 auto; font-size: 12px; color: var(--muted); text-align: right; }
.back { align-self: flex-start; }
.cline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

.cprompt { margin: 0; padding: 8px 10px; border-left: 3px solid var(--line); color: var(--muted); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.name { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: 16px; }
.chat .compose { min-height: 7rem; }
#bStatusText, #cStatusText { white-space: pre-line; }

.answer { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; flex: 0 0 auto; }
.ahead { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.ahead .al { flex: 1 1 auto; font-weight: 650; color: var(--fg); }

.acut { margin: 0; padding: 6px 12px 0; font-size: 12px; color: var(--warn); }
.abody {
    max-height: 45vh; overflow-y: auto; padding: 10px 12px 14px; font-size: 15px; line-height: 1.5;
    white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere;

}
.answer.full .abody { max-height: none; -webkit-mask-image: none; mask-image: none; }
.abody p { margin: 0 0 8px; }
.abody .ah { font-weight: 700; }
.abody pre { margin: 0 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--soft); overflow-x: auto; white-space: pre; font: 13px/1.45 ui-monospace, "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace; }

.aopt .aw { display: flex; flex-direction: column; min-width: 0; }

.aopt .od { font-size: 14px; color: var(--muted); white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }

<noscript><section class="broken"><h1>This page needs JavaScript</h1><p>It encrypts the reply on the phone before sending it.</p></section></noscript>
<script>
/* chatq-crypto-begin */
// The reply and the pairing on the wire. Pure functions over bytes, so
// tests/reply-page-check.js can lift this block out, run it under Node's
// webcrypto and hold it to tests/fixtures/reply-vector.json and
// pair-vector.json - the files the watcher's PowerShell side is held to as
// well, so the two agree byte for byte.
//
// Pairing: the phone makes its own key D and sends it once, sealed to the
// RSA public key the pairing link carries; the PC takes it only once the user
// confirms there the code this phone shows. From then on an alert's link
// carries no secret at all: the key of one alert is derived here, from D and
// the alert's id, the same way the PC derives it.
var ChatqCrypto = (function () {
    'use strict';
    var encoder = new TextEncoder();
    // RSA-OAEP with SHA-256 on a 2048-bit key seals at most this many bytes
    var MAX_PAIR_PAYLOAD = 190;
    function utf8(s) { return encoder.encode(s); }
    function b64url(bytes) {
        var s = '';
        for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    // null for anything that is not base64url, rather than a guess
    function unb64url(s) {
        if (typeof s !== 'string' || !/^[A-Za-z0-9_-]*$/.test(s) || s.length % 4 === 1) return null;
        var bin;
        try { bin = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '=='.slice(0, (4 - s.length % 4) % 4)); } catch (e) { return null; }
        var out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
    }
    function randomBytes(n) {
        var b = new Uint8Array(n);
        crypto.getRandomValues(b);
        return b;
    }
    // D as the phone keeps it: an HMAC key WebCrypto will sign with but never
    // hand back, so a script on this origin can use it while the page is
    // open but cannot copy it off the phone
    function phoneKey(d) {
        return crypto.subtle.importKey('raw', d, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    }
    // a CryptoKey as it is, or raw bytes
    function isKey(key) {
        return !!key && typeof key === 'object' && typeof key.type === 'string' && !!key.algorithm && !!key.usages;
    }
    async function hmac(key, data) {
        var ck = isKey(key) ? key : await phoneKey(key);
        return new Uint8Array(await crypto.subtle.sign('HMAC', ck, data));
    }
    // the key of one alert, from the phone's key (bytes or the kept
    // CryptoKey, the same k either way): the PC makes the same one
    async function alertKey(d, aid) {
        return hmac(d, utf8('chatq-alert:' + aid));
    }
    // The six digits the user matches between the phone and the PC before
    // the PC takes a pairing answer: the first 4 bytes of HMAC(D,
    // "chatq-confirm") big-endian, mod a million. Anyone who answers a
    // pairing alert in the phone's place holds another D, so another code.
    async function confirmCode(d) {
        var h = await hmac(d, utf8('chatq-confirm'));
        var n = h[0] * 16777216 + h[1] * 65536 + h[2] * 256 + h[3];
        return ('00000' + (n % 1000000)).slice(-6);
    }
    // two keys from the alert's one, so the cipher and the MAC never share a key
    async function deriveKeys(k) {
        return { enc: await hmac(k, utf8('enc')), mac: await hmac(k, utf8('mac')) };
    }
    // key order and spelling are the wire format: JSON.stringify keeps both.
    // h, a permission request's digest, goes last and only when given, so
    // every other reply is byte for byte what it always was
    function buildPayload(act, text, nonce, ts, h) {
        var o = { v: 1, act: act, text: text, nonce: nonce, ts: ts };
        if (h) o.h = h;
        return JSON.stringify(o);
    }
    // every byte looked at, wherever the first difference is
    function sameBytes(a, b) {
        if (!a || !b || a.length !== b.length) return false;
        var d = 0;
        for (var i = 0; i < a.length; i++) d |= a[i] ^ b[i];
        return d === 0;
    }
    // A permission request's card, sealed for this phone by the PC: the
    // other direction, so keys of its own - HMAC(D, "chatq-card:" + aid),
    // then enc and mac as for a reply. The MAC first, then the decryption;
    // the object, or null for anything that does not open whole.
    async function openCard(key, aid, card) {
        var p = String(card || '').split('.');
        if (p.length !== 5 || p[0] !== 'chatq1c' || p[1] !== aid || !/^[a-z2-7]{10}$/.test(aid)) return null;

        try {
            var keys = await deriveKeys(await hmac(key, utf8('chatq-card:' + aid)));
            if (!sameBytes(await hmac(keys.mac, utf8(p.slice(0, 4).join('.'))), mac)) return null;

    // it decrypts a byte
    async function sealPayload(k, aid, payload, iv) {
        var keys = await deriveKeys(k);
        var ek = await crypto.subtle.importKey('raw', keys.enc, { name: 'AES-CBC' }, false, ['encrypt']);
        var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-CBC', iv: iv }, ek, utf8(payload)));
        var head = 'chatq1.' + aid + '.' + b64url(iv) + '.' + b64url(ct);
        return head + '.' + b64url(await hmac(keys.mac, utf8(head)));
    }
    // fixed: { iv, nonce, ts } for the test vector; a real send leaves it out
    // and gets a fresh iv and nonce each time, which is what the watcher's
    // replay guard counts on. h: the request a permit answers
    async function seal(k, aid, act, text, fixed, h) {
        fixed = fixed || {};
        var nonce = fixed.nonce !== undefined ? fixed.nonce : b64url(randomBytes(16));
        var ts = fixed.ts !== undefined ? fixed.ts : Date.now();
        var iv = fixed.iv !== undefined ? fixed.iv : randomBytes(16);
        var payload = buildPayload(act, text, nonce, ts, h);
        return { message: await sealPayload(k, aid, payload, iv), payload: payload, nonce: nonce, ts: ts };
    }
    // An answer to a question the chat waits on (docs/phone-ask-spec.md):
    // buildPayload's layout, act answer and text empty, then rid, qh, a and o
    // last, in that order - as a permit's h goes last - so every other reply
    // is byte for byte what it always was. x: { rid, qh, a, o }
    function buildAnswerPayload(nonce, ts, x) {
        return JSON.stringify({ v: 1, act: 'answer', text: '', nonce: nonce, ts: ts, rid: x.rid, qh: x.qh, a: x.a, o: x.o });
    }
    // seal()'s way, for an answer; fixed as seal() takes it
    async function sealAnswer(k, aid, x, fixed) {
        fixed = fixed || {};
        var nonce = fixed.nonce !== undefined ? fixed.nonce : b64url(randomBytes(16));
        var ts = fixed.ts !== undefined ? fixed.ts : Date.now();
        var iv = fixed.iv !== undefined ? fixed.iv : randomBytes(16);
        var payload = buildAnswerPayload(nonce, ts, x);
        return { message: await sealPayload(k, aid, payload, iv), payload: payload, nonce: nonce, ts: ts };
    }
    function buildPairPayload(d, label, ts) {
        return JSON.stringify({ v: 2, d: d, label: label, ts: ts });
    }
    // n and e as the pairing link has them, base64url: exactly a JWK's own
    // spelling, so the key goes in with no parsing of ours
    async function sealPair(n, e, pid, payload) {
        var bytes = utf8(payload);
        if (bytes.length > MAX_PAIR_PAYLOAD) throw new Error('pairing payload over ' + MAX_PAIR_PAYLOAD + ' bytes');
        var pk = await crypto.subtle.importKey('jwk', { kty: 'RSA', n: n, e: e, alg: 'RSA-OAEP-256', ext: true },
            { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
        var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pk, bytes));
        return 'chatq2p.' + pid + '.' + b64url(ct);
    }
    // fixed: { d, ts } for the tests; a real pairing makes a new D
    async function pair(n, e, pid, label, fixed) {
        fixed = fixed || {};
        var d = fixed.d !== undefined ? fixed.d : randomBytes(32);
        var ts = fixed.ts !== undefined ? fixed.ts : Date.now();
        var payload = buildPairPayload(b64url(d), label, ts);
        return { message: await sealPair(n, e, pid, payload), payload: payload, d: d, ts: ts };
    }
    return {
        MAX_PAIR_PAYLOAD: MAX_PAIR_PAYLOAD,
        utf8: utf8, b64url: b64url, unb64url: unb64url, randomBytes: randomBytes, phoneKey: phoneKey, isKey: isKey, hmac: hmac,
        alertKey: alertKey, confirmCode: confirmCode, deriveKeys: deriveKeys, buildPayload: buildPayload, sealPayload: sealPayload, seal: seal,
        buildAnswerPayload: buildAnswerPayload, sealAnswer: sealAnswer, buildPairPayload: buildPairPayload, sealPair: sealPair, pair: pair,
        sameBytes: sameBytes, openCard: openCard
    };
})();
/* chatq-crypto-end */

/* chatq-logic-begin */
// What the page shows and offers, from the link and what this phone keeps.
// Pure functions too, driven by tests/reply-page-check.js the same way.
var ChatqPage = (function () {
    'use strict';
    // sealed, a payload this size stays under ntfy's 4096-byte message limit
    var MAX_PAYLOAD = 2900;
    // warned from here: room left to trim before Send turns off
    var WARN_AT = 2400;
    var ACTS = ['prompt', 'retry', 'allow', 'skip', 'stop', 'status', 'ping',
        // Send now, on a usage alert about a reset coming; a permission
        // request's Allow once and Deny
        'wake', 'permit', 'refuse',
        // the answer to a question the chat waits on, sent from its card
        // (docs/phone-ask-spec.md), not from a button of buttonsFor's
        'answer'];
    var LABEL_MAX = 40, HOST_MAX = 30;
    // text= from outside the page (a Tasker reply) longer than this is dropped
    var TEXT_MAX = 16000;
    var PREFILL_NOTE = 'Filled in from outside the page - check it, then Send.';

    function normEvent(e) {
        return String(e || '').trim().toLowerCase().replace(/[-_\s]+/g, ' ');
    }
    function clean(s, max) {
        return String(s || '').replace(/[\x00-\x1f\x7f]+/g, ' ').trim().slice(0, max);
    }
    // only https: the page is https, and the CSP lets it talk to nothing else
    function serverOf(s) {
        if (!s) return null;
        var u;
        try { u = new URL(s); } catch (e) { return null; }
        if (u.protocol !== 'https:' || u.username || u.password || u.search || u.hash) return null;
        return u.origin + u.pathname.replace(/\/+$/, '');
    }
    function topicOk(t) { return /^[A-Za-z0-9_-]{1,64}$/.test(t || ''); }
    function idOk(a) { return /^[a-z2-7]{10}$/.test(a || ''); }

    // { ok: true, mode: alert | pair, f } or
    // { ok: false, why: missing | old | version | bad }.
    // Two kinds of link. The pairing link is the one push that carries where
    // replies go (s, t) and the PC's public key (n, x). An alert's link
    // carries no secret and nothing about where to send: k, s and t in one
    // are never read, so a link made up to send this phone's replies
    // elsewhere, or with a key of its own, gets nowhere.
    function parseFragment(hash) {
        var h = String(hash || '').replace(/^#/, '');
        if (!h) return { ok: false, why: 'missing' };
        var q = Object.create(null);
        var parts = h.split('&');
        var rawText;
        for (var i = 0; i < parts.length; i++) {
            var eq = parts[i].indexOf('=');
            if (eq < 1) continue;
            // text= is words typed outside the page, read on its own
            // (readText): a broken one never makes the whole link bad
            if (parts[i].slice(0, eq) === 'text') { rawText = parts[i].slice(eq + 1); continue; }

            try { val = decodeURIComponent(parts[i].slice(eq + 1)); } catch (e) { return { ok: false, why: 'bad' }; }

        }
        if (q.v === undefined && q.k === undefined && q.m === undefined && q.a === undefined) return { ok: false, why: 'missing' };
        // v1 put the alert's key in the link; such a link is refused whole
        if (q.v === '1') return { ok: false, why: 'old' };
        if (q.v !== '2') return { ok: false, why: /^[0-9]+$/.test(q.v || '') && +q.v > 2 ? 'version' : 'bad' };
        if (q.m === 'pair') {
            var server = serverOf(q.s);
            var n = /^[A-Za-z0-9_-]+$/.test(q.n || '') ? ChatqCrypto.unb64url(q.n) : null;
            var x = /^[A-Za-z0-9_-]+$/.test(q.x || '') ? ChatqCrypto.unb64url(q.x) : null;
            // 2048 bits at least: the pairing payload is sized for that
            if (!server || !topicOk(q.t) || !idOk(q.a) || !n || n.length < 256 || n.length > 512 || !x || x.length < 1 || x.length > 8) {

        }
        if (q.m !== undefined) return { ok: false, why: 'version' };
        if (!idOk(q.a)) return { ok: false, why: 'bad' };
        return {
            ok: true,
            mode: 'alert',
            f: {
                aid: q.a,
                event: normEvent(q.e),
                seq: /^[0-9]{1,9}$/.test(q.n || '') ? q.n : '',
                title: clean(q.c, 200),
                provider: String(q.p || '').trim().toLowerCase(),
                job: String(q.j || '').trim(),
                jobless: q.x === '1',
                // a usage alert about a reset coming: Send now offered. The
                // PC goes by its own record of the alert, never by this
                wake: q.w === '1',
                text: readText(rawText),
                // a permission request's card, sealed for this phone: taken
                // only in its own shape, and opened only with the phone's key
                card: /^chatq1c\.[a-z2-7]{10}\.[A-Za-z0-9_.-]+$/.test(q.r || '') ? q.r : '',

                // unix seconds, so the page knows how far back to look
                full: q.f === '1',

                // s: usage and the chats at work as the alert went - shown
                // under the title, as text only
                status: clean(q.s, 200)

    }
    // Words typed outside the page - a Tasker reply - for the box, and only
    // for the box. NOTHING in a link sends, acts, confirms or presses a
    // button. The page holds this phone's key; an alert's id is no secret
    // (Join logs its pushes, the lock screen shows them), and anything can
    // open a link - another app, a web page, a QR code, a restored tab, a
    // link preview. A link that sent would seal and post whatever it says
    // with this phone's key, and the MAC would check out: the MAC proves
    // this page sealed it, not that the person meant it. The tap on Send
    // is the one thing that does. So text is typed into the box, and there
    // it waits. + is a space first (Tasker's and Java's URL encoders write
    // spaces so; a real + comes as %2B); a broken escape, or more than
    // TEXT_MAX characters, is none at all; control characters but the
    // newline and tab go, and CRLF is a newline.

    // fields and nothing else, rebuilt rather than copied from the link -
    // never the text a link brought, which goes into the draft instead
    function alertFragment(f) {
        var q = [['v', '2'], ['a', f.aid], ['e', f.event], ['n', f.seq], ['c', f.title], ['p', f.provider], ['j', f.job]];

            show1('permitFine', pv.fine);
            if (pv.state === 'open') permitTimer = setTimeout(permitTick, 60000);
        }
        $('compose').hidden = !spec.text;
        $('hint').textContent = spec.hint;
        $('about').textContent = spec.about;
        $('about').hidden = !spec.about;
        $('fine').textContent = 'To ' + (phone.host ? 'chatq on ' + phone.host : 'your PC') + '. Encrypted on this phone; ' + P.hostOf(phone.server) + ' only passes it on.';
        $('status').hidden = true;
        $('again').hidden = true;
        $('log').textContent = '';
        var ta = $('text');
        ta.placeholder = spec.placeholder;
        ta.value = '';
        if (spec.text) {
            var d = readDraft();
            if (d) {
                ta.value = d.text;
                if (d.sealed && typeof d.sealed.message === 'string' && d.sealed.text === d.text.trim()) {
                    pending = { message: d.sealed.message, b: spec.send, btn: $('send'), text: d.sealed.text };
                }
            }
        }
        // text a link brought (a Tasker reply): into the box, never sent -
        // see readText. Kept as this tab's draft at once, since the bar no
        // longer has it, and used once: this alert shown again fills
        // nothing. A sealed message for other text is not this one's.
        var pre = P.prefill(spec, f, spec.text ? readDraft() : null);
        if (f.text) {
            if (pre.text !== null) {
                ta.value = pre.text;
                if (pending && pending.text !== pre.text.trim()) pending = null;
                saveDraft();
            }
            f.text = '';
        }
        $('prefill').textContent = pre.note;
        $('prefill').hidden = !pre.note;
        var more = $('more');
        more.textContent = '';
        spec.more.forEach(function (b) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.setAttribute('data-act', b.act);
            btn.setAttribute('data-label', b.label);
            btn.textContent = b.label;
            btn.addEventListener('click', function () { press(b, btn); });
            more.appendChild(btn);
        });
        more.hidden = !spec.more.length;
        var send = $('send');
        send.setAttribute('data-act', spec.send.act);
        send.setAttribute('data-label', spec.send.label);
        if (pending) show('bad', 'Not known to have arrived. Try again sends the very same message; the PC drops a second copy.', true);
        refresh();
        if (spec.text) {
            try { ta.focus({ preventScroll: true }); } catch (e) { ta.focus(); }
            // the caret after what was filled in, where a correction goes
            if (pre.note) { try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) { } }
        }
    }

    // a failed send of this same act and text is waiting to go again
    function retrying(act, text) {
        return !!pending && pending.b.act === act && pending.text === text;
    }

    // the counter, and the big button's label and state, from the text now
    function refresh() {
        if (!spec) return;
        var send = $('send');
        if (!spec.text) {
            if (!busy) send.textContent = retrying(spec.send.act, '') ? 'Try again' : spec.send.label;
            send.disabled = busy;
            return;
        }
        var ta = $('text');
        var text = ta.value.trim();
        var c = P.counter(text);
        var count = $('count');
        count.textContent = c.label;
        count.setAttribute('data-state', c.state);
        // what was just sent stays readable, greyed, until it is changed
        var same = sentText !== null && text === sentText;
        ta.classList.toggle('sent', same);
        // a button asking for its second tap keeps asking
        if (!busy && send.getAttribute('data-armed') !== '1') send.textContent = retrying(spec.send.act, text) ? 'Try again' : same ? 'Send again' : spec.send.label;
        // Allow and Deny go with the box empty: the note is optional
        send.disabled = busy || (!text && !spec.optional) || c.state === 'over';
    }

    function buttons() {
        return Array.prototype.slice.call($('more').querySelectorAll('button')).concat([$('send')]);
    }

    function setBusy(on, which) {
        busy = on;
        buttons().forEach(function (b) {
            b.disabled = on;
            if (on && b === which) b.textContent = 'Sending\u2026';
            if (!on && b.id !== 'send') b.textContent = b.getAttribute('data-label');
        });
        $('app').setAttribute('aria-busy', on ? 'true' : 'false');
        refresh();
        // the question's own Send, off while anything is out
        if (asks.ask) askSync(asks.ask);
    }

    // Skip and Stop cannot be taken back: the first tap asks, the second
    // acts - but only a deliberate second tap, not one within CONFIRM_MS
    function armed(b, btn) {
        if (!b.confirm) return true;
        if (btn.getAttribute('data-armed') === '1') {
            if (Date.now() - (btn._armedAt || 0) < CONFIRM_MS) return false;
            clearTimeout(btn._disarm);
            btn.removeAttribute('data-armed');
            return true;
        }
        btn.setAttribute('data-armed', '1');
        btn._armedAt = Date.now();
        btn.textContent = b.confirm;
        btn._disarm = setTimeout(function () {
            btn.removeAttribute('data-armed');
            if (!busy) btn.textContent = b.label;
        }, 3000);
        return false;
    }

    function show(kind, text, canRetry) {
        var s = $('status');
        s.setAttribute('data-kind', kind);
        $('statusText').textContent = text;
        $('again').hidden = !canRetry;
        s.hidden = false;
    }

    async function press(b, btn) {
        if (busy || mode !== 'alert') return;
        if (!armed(b, btn)) return;
        // the box is the prompt, or Deny's note; Allow sends no text at all
        var text = b.act === 'prompt' || b.act === 'refuse' ? $('text').value.trim() : '';
        if (b.act === 'prompt' && (!text || P.counter(text).state === 'over')) return;
        if (b.act === 'refuse' && P.counter(text).state === 'over') return;
        // a permit names the request as the card showed it, or is not sent
        var h = b.act === 'permit' && f.permit ? f.permit.h : undefined;
        if (b.act === 'permit' && !h) return;
        // The same act and text as a send that failed: the same sealed
        // message again, not a new one. If the first did arrive after all,
        // its nonce is spent and the watcher drops the copy; a new seal would
        // get past that and run the prompt twice.
        if (retrying(b.act, text)) {
            pending.btn = btn;
            return deliver();
        }
        setBusy(true, btn);
        var sealed;
        try {
            sealed = await C.seal(await C.alertKey(phone.key, f.aid), f.aid, b.act, text, undefined, h);
        } catch (e) {
            setBusy(false);
            show('bad', P.errorText({ kind: 'crypto' }, P.hostOf(phone.server)), false);
            return settle();
        }
        pending = { message: sealed.message, b: b, btn: btn, text: text };
        saveDraft();
        return deliver();
    }

    async function deliver() {
        var p = pending;
        if (!p) return;
        setBusy(true, p.btn);
        show('wait', 'Sending\u2026', false);
        var r = await post(P.postUrl(phone), p.message);
        setBusy(false);
        if (!r.ok) {
            show('bad', P.errorText(r, P.hostOf(phone.server)), true);
            refresh();
            return settle();
        }
        pending = null;
        if (p.b.act === 'prompt') {
            sentText = p.text;
            sdel(draftKey());
        } else {
            saveDraft();
        }
        if (p.b.act === 'answer') askSent('ask', p.rid);
        log(p);
        show('ok', P.sentText(p.b), false);
        refresh();
        // the keyboard down, so the confirmation is what shows
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        settle();
    }

    // A new link that came while a POST was out waits for it: resetting then
    // would lose whether the message arrived, and a Try again with it
    function settle() {
        if (reinit && !busy) init();
    }

    // Content-Type text/plain and no other header: a CORS simple request, so
    // no preflight - one round trip on a phone's network
    function post(url, body) {
        var ctl = typeof AbortController === 'function' ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: body,
            mode: 'cors',
            credentials: 'omit',
            cache: 'no-store',
            referrerPolicy: 'no-referrer',
            signal: ctl ? ctl.signal : undefined
        }).then(function (res) {
            return res.ok ? { ok: true } : { ok: false, kind: 'http', status: res.status };
        }, function (e) {
            return { ok: false, kind: e && e.name === 'AbortError' ? 'timeout' : 'network' };
        }).then(function (r) {
            clearTimeout(timer);
            return r;
        });
    }

    function log(p) {
        var now = new Date();
        var hhmm = ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
        var what = p.b.act === 'prompt' ? '"' + (p.text.length > 60 ? p.text.slice(0, 60) + '\u2026' : p.text) + '"' : p.b.label;
        var li = document.createElement('li');
        li.textContent = hhmm + '  sent ' + what;
        var ol = $('log');
        ol.insertBefore(li, ol.firstChild);
        while (ol.children.length > 3) ol.removeChild(ol.lastChild);
    }

    // --- what the PC sends to the phone -----------------------------------------

    // A GET to the ntfy server: its poll, or an attachment. No header, no
    // cookie, no referrer - a CORS simple request - and the body read to
    // max bytes, then dropped. { ok, text } or { ok: false, status | kind }.
    function getText(url, max) {
        var ctl = typeof AbortController === 'function' ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
        return fetch(url, {
            method: 'GET',
            mode: 'cors',
            credentials: 'omit',
            cache: 'no-store',
            referrerPolicy: 'no-referrer',
            signal: ctl ? ctl.signal : undefined
        }).then(async function (res) {
            if (!res || !res.ok) return { ok: false, kind: 'http', status: res ? res.status : 0 };
            if (res.body && typeof res.body.getReader === 'function') {
                var rd = res.body.getReader(), chunks = [], total = 0;
                for (; ;) {
                    var x = await rd.read();
                    if (x.done) break;
                    total += x.value.length;
                    if (total > max) { if (ctl) ctl.abort(); return { ok: false, kind: 'big' }; }
                    chunks.push(x.value);
                }
                var all = new Uint8Array(total), at = 0;
                chunks.forEach(function (c) { all.set(c, at); at += c.length; });
                return { ok: true, text: new TextDecoder().decode(all) };
            }
            if (typeof res.text !== 'function') return { ok: false, kind: 'network' };
            var t = await res.text();
            return t.length > max ? { ok: false, kind: 'big' } : { ok: true, text: t };
        }, function (e) {
            return { ok: false, kind: e && e.name === 'AbortError' ? 'timeout' : 'network' };
        }).then(function (r) {
            clearTimeout(timer);
            return r;
        }, function () {
            clearTimeout(timer);
            return { ok: false, kind: 'network' };
        });
    }

    // the phone's down topic, worked out from its key once a load
    async function topicOf() {
        if (!bd.topic) bd.topic = await B.downTopic(phone.key);
        return bd.topic;
    }

    // One look at the down topic for the answer titled did, sent since a
    // unix time: the newest one that opens, of a kind in prefer when there
    // is one. An attachment is fetched only from this server's /file/, and
    // one past its 3 hours is gone. { payload, gone, nodecomp, err }.
    async function lookDown(did, since, prefer) {
        var topic = await topicOf();
        var r = await getText(B.pollUrl(phone.server, topic, since, did), 262144);
        if (!r.ok) return { err: r };
        var msgs = B.parseFeed(r.text).reverse(), got = null, gone = false;
        for (var i = 0; i < msgs.length; i++) {
            var m = msgs[i], body = m.message;
            if (m.attachment) {
                var chk = B.attachmentCheck(phone.server, m.attachment, Date.now());
                if (chk === 'gone') { gone = true; continue; }
                if (chk !== 'ok') continue;
                var a = await getText(m.attachment.url, B.MAX_ATTACH);
                if (!a.ok) { if (a.status === 404) gone = true; continue; }
                body = a.text;
            }
            var o = await B.openDown(phone.key, body, did);
            if (o.why === 'nodecomp') return { nodecomp: true };
            if (!o.ok) continue;
            if (!prefer || prefer.indexOf(o.payload.kind) >= 0) return { payload: o.payload };
            if (!got) got = o.payload;
        }
        return { payload: got, gone: gone };
    }

    // Looks every 4 s until an answer or ms are up, as long as live() says
    // the screen asking is still up; done(result) either way
    function waitDown(did, since, ms, prefer, first, live, done) {
        var until = Date.now() + ms;
        var tick = async function () {
            if (!live()) return;
            var r = await lookDown(did, since, prefer);
            if (!live()) return;
            if (r.payload || r.nodecomp || Date.now() >= until) return done(r);
            setTimeout(tick, POLL_MS);
        };
        setTimeout(tick, first);
    }

    // A compose act (the board, a chat, the queue) sealed and posted; then
    // the answer waited for under its id. keep: a failed send of the same
    // act, whose very message goes again - its nonce spent if it did
    // arrive, so the PC drops the copy. show(kind, text, canRetry) says how
    // it goes; done(result, sealed) gets the answer, or none.
    async function sendAct(act, x, show, live, done, keep, prefer) {
        var sealed = keep || null;
        if (!sealed) {
            try { sealed = await B.compose(phone.key, act, x); } catch (e) { show('bad', P.errorText({ kind: 'crypto' }, P.hostOf(phone.server)), false); return null; }
        }
        show('wait', 'Sending\u2026', false);
        var sent = Date.now();
        var r = await post(P.postUrl(phone), sealed.message);
        if (!live()) return sealed;
        if (!r.ok) { show('bad', P.errorText(r, P.hostOf(phone.server)), true); done(null, sealed, true); return sealed; }
        show('wait', 'Sent - waiting for the PC\u2026', false);
        waitDown(sealed.cid, Math.floor(sent / 1000) - 60, WAIT_MS, prefer || ['ack'], POLL_MS, live, function (res) { done(res, sealed, false); });
        return sealed;
    }

    // --- the board: the overlay on the phone -------------------------------------
    // The bare page on a paired phone. It asks for the board with a compose
    // act, then polls the down topic for the answer. Asked again on
    // Refresh, after anything done here, and every 30 s while the page is in
    // view - for 10 minutes, then it waits for a tap: every answer is one of
    // ntfy.sh's 250 messages a day. Nothing opened is kept but here.
    var POLL_MS = 4000, WAIT_MS = 45000, REFRESH_MS = 30000, REFRESH_FOR_MS = 600000;
    var CDRAFT = 'chatq-cdraft:';
    // said: a refusal that sent the chat view back here, shown with the notes
    var bd = { b: null, asking: false, gen: 0, refresh: null, started: 0, paused: false, fromAlert: false, topic: null, stale: false, at: 0, waitVisible: false, said: '' };
    // the PC's list of chats (act list), asked for once by Older chats - the
    // board shows only the chats the overlay does - and kept for the load
    var older = { list: null, asking: false };
    // the chat view: { type, row, chat, folder, gen, busy, pending }. gen is
    // this view's own number, never another's: an answer to a message sent
    // from a view left since lands nowhere, not in the view opened after it
    var cv = null, cvSeq = 0;

    function views(which) {
        $('app').hidden = which !== 'app';
        $('card').hidden = which !== 'card';
        $('board').hidden = which !== 'board';
        $('chat').hidden = which !== 'chat';
    }
    function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined && text !== null && text !== '') e.textContent = text;
        return e;
    }
    function hiddenPage() { return typeof document.visibilityState === 'string' && document.visibilityState === 'hidden'; }
    // what any screen of the board or a chat was waiting for is dropped
    function stopBoard() {
        bd.gen++;
        clearTimeout(bd.refresh);
        bd.refresh = null;
        bd.asking = false;
        if (cv) cv.gen++;
        panel('answer').gen++;
        panel('cAnswer').gen++;
    }

    function openBoard(fromAlert) {
        stopBoard();
        mode = 'board';
        cv = null;
        bd.fromAlert = !!fromAlert;
        bd.started = Date.now();
        bd.paused = false;
        views('board');
        document.title = 'chatq board';
        $('bHost').textContent = 'chatq on ' + (phone.host || 'your PC');
        $('bBack').hidden = !bd.fromAlert;
        $('bStatus').hidden = true;
        if (bd.b) drawBoard(); else drawWaiting();
        askBoard();
    }
    // back from a chat: the board as it was, asked again when it is old or
    // something was done meanwhile
    function backToBoard() {
        if (cv) cv.gen++;
        cv = null;
        mode = 'board';
        views('board');
        document.title = 'chatq board';
        if (bd.b) drawBoard(); else drawWaiting();
        if (bd.stale || Date.now() - bd.at > REFRESH_MS) { bd.stale = false; askBoard(); }
        else scheduleRefresh();
    }
    function bShow(kind, text, again) {
        $('bStatus').setAttribute('data-kind', kind);
        $('bStatusText').textContent = text;
        $('bAgain').hidden = !again;
        $('bStatus').hidden = false;
    }
    async function askBoard() {
        if (bd.asking || !phone) return;
        var my = bd.gen;
        bd.asking = true;
        $('bRefresh').disabled = true;
        var live = function () { return my === bd.gen; };
        var quiet = function (kind, text, again) { if (kind === 'bad') bShow(kind, text, again); };
        await sendAct('board', {}, quiet, live, function (res, sealed, failed) {
            if (!live()) return;
            bd.asking = false;
            $('bRefresh').disabled = false;
            if (failed) return;
            var p = res && res.payload;
            if (p && p.kind === 'board') {
                bd.b = p;
                bd.at = Date.now();
                $('bStatus').hidden = true;
                if (mode === 'board') drawBoard();
                scheduleRefresh();
            } else if (p && p.kind === 'ack') {
                if (mode === 'board') bShow('bad', p.say || 'The PC refused.', false);
            } else if (!bd.b) {
                if (mode === 'board') drawNoAnswer();
            } else if (mode === 'board') {
                bShow('bad', 'No new board from the PC - this one is from ' + B.hhmm(new Date(bd.b.ts || bd.at).toISOString()) + '.', false);
            }
        }, null, ['board']);
    }
    // every 30 s while the board is in view, for 10 minutes; hidden, it
    // waits for the page to be seen again
    function scheduleRefresh() {
        clearTimeout(bd.refresh);
        var my = bd.gen;
        bd.refresh = setTimeout(function () {
            if (my !== bd.gen || mode !== 'board') return;
            if (Date.now() - bd.started > REFRESH_FOR_MS) { bd.paused = true; drawNotes(); return; }
            if (hiddenPage()) { bd.waitVisible = true; return; }
            askBoard();
        }, REFRESH_MS);
    }
    function drawWaiting() {
        var list = $('bList');
        list.textContent = '';
        for (var i = 0; i < 3; i++) list.appendChild(el('div', 'skel'));
        list.appendChild(el('p', 'bempty', 'Asking the PC for your chats\u2026'));
        $('bUsage').hidden = true;
        $('bSearch').hidden = true;
        $('bNew').hidden = true;
        $('bListen').textContent = '';
        drawNotes();
    }
    function drawNoAnswer() {
        var t = B.cardText('nolisten');
        var list = $('bList');
        list.textContent = '';
        var c = el('div', 'bcard');
        c.setAttribute('data-kind', 'nolisten');
        c.appendChild(el('h2', '', t.head));
        c.appendChild(el('p', '', t.body));
        c.appendChild(el('p', 'fine', t.fine));
        // a pairing not confirmed yet on the PC reads as no answer too
        if (phone && phone.code) c.appendChild(el('p', 'fine', 'Not confirmed on the PC yet? This phone\'s code is ' + P.codeText(phone.code) + '.'));
        var again = el('button', 'primary', t.button);
        again.type = 'button';
        again.addEventListener('click', function () { bd.started = Date.now(); drawWaiting(); askBoard(); });
        c.appendChild(again);
        list.appendChild(c);
    }
    function drawNotes() {
        var n = bd.b ? B.notices(bd.b) : [];
        if (bd.said) n.unshift(bd.said + '.');
        if (bd.paused) n.push('Paused - tap Refresh.');
        if (phone && phone.readable) n.push(P.READABLE);
        $('bNote').textContent = n.join(' ');
        $('bNote').hidden = !n.length;
    }
    function drawUsage(usage) {
        var u = $('bUsage');
        u.textContent = '';
        var lines = B.usageLines(usage);
        u.hidden = !lines.length;
        lines.forEach(function (l) {
            var st = l.stale ? ' stale' : '';
            u.appendChild(el('span', 'un' + st, l.name || '\u00a0'));
            u.appendChild(el('span', 'uw' + st, l.w));
            var bar = document.createElement('progress');
            bar.setAttribute('max', '100');
            bar.setAttribute('value', String(l.pct));
            bar.setAttribute('data-tone', l.tone);
            bar.textContent = l.pct + '%';
            u.appendChild(bar);
            u.appendChild(el('span', 'ur' + st, l.pct + '%' + (l.right ? '  ' + l.right : '')));
        });
    }
    function drawBoard() {
        var b = bd.b;
        $('bHost').textContent = 'chatq on ' + (b.host || phone.host || 'your PC');
        $('bTime').textContent = b.ts ? B.hhmm(new Date(b.ts).toISOString()) : '';
        drawUsage(b.usage);
        drawNotes();
        $('bSearch').hidden = false;
        $('bNew').hidden = !(b.compose && (b.folders || []).length);
        $('bListen').textContent = B.listenText(b);
        drawRows();
    }
    function drawRows() {
        var list = $('bList'), q = String($('bSearch').value || '').trim(), any = false;
        list.textContent = '';
        B.sections(bd.b, older.list).forEach(function (s) {
            var rows = B.filterRows(s.rows, q);
            if (!rows.length) return;
            any = true;
            var h = el('p', 'shead', s.head);
            h.setAttribute('data-sec', s.key);
            list.appendChild(h);
            rows.forEach(function (r) { list.appendChild(rowEl(s.key, s.type, r)); });
        });
        if (!any) list.appendChild(el('p', 'bempty', q ? 'No chat matches "' + q + '".' : 'Nothing open, nothing queued.'));
        var more = older.list ? +older.list.more || 0 : bd.b.more;
        if (more > 0) list.appendChild(el('p', 'bmore', '+' + more + ' older chats are not listed.'));
        // the rest of the PC's chats, Codex's too, one tap away
        if (!older.list && bd.b.compose) {
            var ob = el('button', 'linkish', older.asking ? 'Asking for older chats\u2026' : 'Older chats');
            ob.type = 'button';
            ob.id = 'bOlder';
            ob.disabled = older.asking;
            ob.addEventListener('click', askOlder);
            list.appendChild(ob);
        }
    }
    // The PC's list: its 30 newest chats and the open ones, each with a
    // handle of its own, drawn under the board's as Older chats
    async function askOlder() {
        if (older.asking || !phone) return;
        var my = bd.gen;
        older.asking = true;
        if (mode === 'board') drawRows();
        var live = function () { return my === bd.gen; };
        var quiet = function (kind, text, again) { if (kind === 'bad') bShow(kind, text, again); };
        await sendAct('list', {}, quiet, live, function (res, sealed, failed) {
            older.asking = false;
            if (!live()) return;
            var p = res && res.payload;
            if (p && p.kind === 'list') older.list = { chats: p.chats || [], more: p.more || 0 };
            else if (!failed && mode === 'board') bShow('bad', p && p.say ? p.say : 'No list from the PC.', false);

    function readDraftC() {
        var k = draftKeyC();

        var k = draftKeyC();

    function cPayload() {
        var text = $('cText').value.trim();
        if (cv.type === 'new') return { act: 'new', x: { h: cv.folder.h, name: $('cName').value.trim().slice(0, 60), text: text } };
        return { act: 'send', x: { h: cv.chat.h, id: cv.chat.id8, text: text } };
    }
    // the byte counter and Send, as the alert form has them
    function refreshC() {
        if (!cv || cv.type === 'folders') return;
        var p = cPayload(), n = B.composeBytes(p.act, p.x), base = B.composeBytes(p.act, { h: 'aaaaaa', id: 'aaaaaaaa', name: '', text: '' });
        var over = n > P.MAX_PAYLOAD;
        $('cCount').textContent = over ? (n - P.MAX_PAYLOAD) + ' bytes too long' : (n - base) + ' / ' + (P.MAX_PAYLOAD - base) + ' bytes';
        $('cCount').setAttribute('data-state', over ? 'over' : n >= P.WARN_AT ? 'warn' : 'ok');

    function setBusyC(on) {

    // an ack: said, green or red; a list out of date is asked for again;
    // no answer at all keeps the message for Try again
    function onAckC(res, sealed, failed, what) {
        setBusyC(false);
        if (failed) { cv.pending = what; refreshC(); return; }
        var p = res && res.payload;
        if (!p) {
            cv.pending = what;
            cShow('bad', 'Sent, but no answer yet. The PC reads it if it listens within 30 minutes; after that it is dropped.', !!what);
            refreshC();
            return;
        }
        cv.pending = null;
        if (p.ok) {
            cShow('ok', p.say || 'Done.', false);
            bd.stale = true;
            if (what && what.text !== undefined) { var k = draftKeyC(); if (k) sdel(k); $('cText').value = ''; }
        } else {
            cShow('bad', p.say || 'The PC refused.', false);

    // The chat or its job moved on at the PC since this view was drawn, or
    // its handle did: its buttons are not what the PC has any more, and a
    // second tap would act on what the phone never showed. Back to the
    // board, asked for afresh - the older chats too, when they were listed -
    // the refusal said there; the text waits in its draft for the chat.
    function outOfDate(say) {
        saveDraftC();
        bd.stale = true;
        backToBoard();
        bd.said = say;
        drawNotes();
        if (older.list) { older.list = null; askOlder(); }
    }
    async function sendC() {
        if (!cv || cv.busy || cv.type === 'folders') return;
        var p = cPayload();
        if (!p.x.text || B.composeBytes(p.act, p.x) > P.MAX_PAYLOAD) return;
        var my = cv.gen, what = { text: p.x.text, sealed: null };
        var keep = cv.pending && cv.pending.text === p.x.text ? cv.pending.sealed : null;
        setBusyC(true);
        what.sealed = await sendAct(p.act, p.x, cShow, function () { return cv && cv.gen === my; }, function (res, sealed, failed) {
            if (!cv || cv.gen !== my) return;
            what.sealed = sealed;
            onAckC(res, sealed, failed, what);
        }, keep);
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
    async function chatAct(a, btn) {
        if (!cv || cv.busy) return;
        if (!armed(a, btn)) return;
        if (a.act === 'read') return readChat(a.h);
        var my = cv.gen;
        setBusyC(true);
        // Try again belongs to a message typed; an act is tapped again
        var say = function (kind, text) { cShow(kind, text, false); };
        await sendAct(a.act, { h: a.h, n: a.n }, say, function () { return cv && cv.gen === my; }, function (res, sealed, failed) {
            if (!cv || cv.gen !== my) return;
            onAckC(res, sealed, failed, null);
        });
    }
    // a chat's last answer, asked for by its handle
    async function readChat(h) {
        var id = 'cAnswer', p = panel(id), my = ++p.gen;
        p.payload = null;
        p.full = false;
        if (!B.canInflate()) return drawPanel(id, 'nodecomp');
        drawPanel(id, 'loading');
        var live = function () { return panel(id).gen === my && mode === 'chat'; };
        var quiet = function (kind, text) { if (kind === 'bad') drawPanel(id, 'none', { text: text }); };
        await sendAct('read', { h: h }, quiet, live, function (res, sealed, failed) {
            if (!live() || failed) return;
            settlePanel(id, res, function () { readChat(h); });
        }, null, ['reply', 'ack']);
    }

    // --- the whole answer, above the box --------------------------------------------

    var panels = {};
    function panel(id) { return panels[id] || (panels[id] = { gen: 0, payload: null, full: false, note: '' }); }
    function stopPanel(id) { panel(id).gen++; }
    // A panel in one of its states: loading, shown, none (with Ask the PC
    // for it), gone, asked, noanswer, nodecomp. Built with createElement
    // and textContent alone: nothing the PC sent is ever read as markup.
    function drawPanel(id, state, extra) {
        var p = panel(id), box = $(id);
        extra = extra || {};
        box.hidden = false;
        box.textContent = '';
        box.setAttribute('data-state', state);
        box.classList.toggle('full', !!p.full);
        if (state === 'shown' && p.payload) {
            var pl = p.payload;
            var one = el('button', 'aone', 'Claude\'s answer - tap to read');
            one.type = 'button';
            one.addEventListener('click', function () { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); });
            box.appendChild(one);
            var head = el('div', 'ahead');
            head.appendChild(el('span', 'al', B.answerHead(pl)));
            var all = el('button', '', p.full ? 'Show less' : 'Show all');
            all.type = 'button';
            all.addEventListener('click', function () { p.full = !p.full; drawPanel(id, 'shown'); });
            head.appendChild(all);
            var copy = el('button', '', 'Copy');
            copy.type = 'button';
            copy.addEventListener('click', function () { copyAnswer(id); });
            head.appendChild(copy);
            box.appendChild(head);
            var cut = B.cutText(pl.cut);
            if (cut) box.appendChild(el('p', 'acut', cut));
            var body = el('div', 'abody');
            drawBlocks(body, B.answerModel(pl.parts));
            box.appendChild(body);
            if (p.note) box.appendChild(el('div', 'astate', p.note));
            return;
        }
        var st = el('div', 'astate');
        st.appendChild(el('span', '', extra.text || B.PANEL[state] || ''));
        if (extra.ask) {
            var ask = el('button', '', B.PANEL.ask);
            ask.type = 'button';
            ask.addEventListener('click', extra.ask);
            st.appendChild(ask);
        }
        box.appendChild(st);
    }
    function drawBlocks(body, blocks) {
        blocks.forEach(function (k) {
            if (k.t === 'pre') {
                var pre = el('pre', k.table ? 'tbl' : '');
                pre.appendChild(el('code', '', k.s));
                body.appendChild(pre);
            } else if (k.t === 'h') {
                body.appendChild(el('p', 'ah', k.s));
            } else if (k.t === 'tool') {
                body.appendChild(el('p', 'tool', '\u2192 ' + k.s));
            } else if (k.t === 'tools') {
                var btn = el('button', 'tools', '\u2192 ' + k.items.length + ' tools');
                btn.type = 'button';
                var list = el('div', 'toollist');
                list.hidden = true;
                k.items.forEach(function (s) { list.appendChild(el('p', 'tool', '\u2192 ' + s)); });
                btn.addEventListener('click', function () { list.hidden = !list.hidden; });
                body.appendChild(btn);
                body.appendChild(list);
            } else if (k.t === 'note') {
                body.appendChild(el('p', 'note', k.s));
            } else {
                var para = el('p', '');
                (k.spans || []).forEach(function (s) { para.appendChild(el(s.t === 'code' ? 'code' : s.t === 'b' ? 'strong' : 'span', '', s.s)); });
                body.appendChild(para);
            }
        });
    }
    function copyAnswer(id) {
        var p = panel(id), text = B.answerText(p.payload && p.payload.parts);
        var fail = function () { p.note = 'Copy is blocked here'; drawPanel(id, 'shown'); };
        try {
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                navigator.clipboard.writeText(text).then(function () { p.note = 'Copied.'; drawPanel(id, 'shown'); }, fail);
            } else fail();
        } catch (e) { fail(); }
    }
    // The question the chat waits on, above its answer panel: #ask for the
    // alert's #answer, #cAsk for the chat view's #cAnswer. createElement and
    // textContent alone, as the answer is drawn.
    function askBoxOf(id) { return id === 'cAnswer' ? 'cAsk' : 'ask'; }
    // What each box's card holds while it can be answered: { ask, v, wire,
    // ctx, s (the choices), inputs, texts, btn, count, sent, sealed and
    // sealedKey (a board send to go again as it was), key, timer }. Only the choices go to sessionStorage, under ADRAFT + rid;
    // the question itself lives here, as the board does.
    var ADRAFT = 'chatq-adraft:', asks = {}, askSeq = 0;
    // where an answer from this box goes: the alert's own key on its page,
    // the row's handle in the board's chat view; null for neither
    function askCtx(id) {
        if (id === 'ask') return mode === 'alert' && f && phone ? { aid: f.aid } : null;
        var chat = cv && cv.chat;
        return mode === 'chat' && chat && chat.h && chat.id8 && bd.b && bd.b.compose ? { h: chat.h, id: chat.id8 } : null;
    }
    function drawAsk(id, ask) {

        // a failed answer waiting for Try again belongs to the question it
        // was sealed for: a card for another one, or none, drops it

        box.hidden = !v;
        if (!v) return;

            inputs: [], texts: [], sent: false, sealed: null, key: '', timer: null, name: 'aq' + (++askSeq) + '-'
        } : null;

    }
    // one question's choices: a radio each (a checkbox each for a multiple

    function askChoices(id, st, c, q) {

            inp.addEventListener('change', function () {
                if (asks[id] !== st) return;
                if (i < 0) B.pickOther(st.s, st.v, q, !!inp.checked);
                else B.pickOption(st.s, st.v, q, i, !!inp.checked);

            if (o.desc) words.appendChild(el('span', 'od', o.desc));

            list.appendChild(lab);

        lab.appendChild(input(-1));

    function askBusy(st) { return st.wire === 'alert' ? busy : !!(cv && cv.busy); }
    // the alert page's failed answer is this very one - the same question
    // (rid) and the same choices (key) - so Try again may send it as sealed
    function answerPending(key, rid) { return !!pending && pending.b.act === 'answer' && pending.key === key && pending.rid === rid; }
    // the inputs, the byte counter and Send, from the choices now
    function askSync(st) {
        var form = B.answerForm(st.v, st.s, st.wire, st.ctx, P.MAX_PAYLOAD), bz = askBusy(st), off = bz || st.sent;
        st.key = JSON.stringify([form.x.a, form.x.o]);
        st.inputs.forEach(function (x) {
            x.el.checked = x.i < 0 ? !!st.s.other[x.q] : st.s.pick[x.q].indexOf(x.i) >= 0;
            x.el.disabled = off;
        });
        st.texts.forEach(function (t) { t.disabled = off; });
        st.count.textContent = form.label;
        st.count.hidden = !form.label;
        st.count.setAttribute('data-state', form.over ? 'over' : 'ok');
        // a failed send of this very answer goes again as the same message
        var again = st.wire === 'alert' ? answerPending(st.key, st.v.rid) : !!st.sealed && st.sealedKey === st.key;

        btn.disabled = off || !form.ok;

    // a choice changed: kept as the draft, and a second tap asked for anew -
    // the one armed was for the answer as it was
    function askChanged(st) {
        sset(ADRAFT + st.v.rid, B.answerDraft(st.s));
        var btn = st.btn;
        if (btn.getAttribute('data-armed') === '1') { clearTimeout(btn._disarm); btn.removeAttribute('data-armed'); }
        askSync(st);
        if (st.wire === 'alert' && pending && pending.b.act === 'answer' && !answerPending(st.key, st.v.rid)) { pending = null; $('again').hidden = true; }
    }
    // once a minute while it can be answered: past until, read-only
    function askTick(id, st) {
        st.timer = setTimeout(function () {
            if (asks[id] !== st) return;
            if (Date.now() >= st.v.until && !askBusy(st)) return drawAsk(id, st.ask);
            askTick(id, st);
        }, 60000);
    }
    // the answer went (alert: the POST; board: an ack ok): the draft goes,
    // and Send says Sent
    function askSent(id, rid) {
        sdel(ADRAFT + rid);
        var st = asks[id];
        if (st && st.v.rid === rid) { st.sent = true; askSync(st); }
    }
    // Send answer's second tap. On an alert's page it goes the way the
    // page's other acts go - sealed with the alert's key, the status and Try
    // again below; in the board's chat view, as a compose act whose ack is
    // said in the chat's status line
    async function sendAnswer(id) {
        var st = asks[id];
        if (!st || st.sent || askBusy(st)) return;
        if (Date.now() >= st.v.until) return drawAsk(id, st.ask);
        var form = B.answerForm(st.v, st.s, st.wire, st.ctx, P.MAX_PAYLOAD);
        if (!form.ok) return;
        var key = JSON.stringify([form.x.a, form.x.o]), rid = st.v.rid;
        if (st.wire === 'alert') {
            if (mode !== 'alert' || !f || f.aid !== st.ctx.aid) return;
            if (answerPending(key, rid)) {
                pending.btn = st.btn;
                return deliver();
            }
            setBusy(true, st.btn);
            var sealed;
            try {
                sealed = await C.sealAnswer(await C.alertKey(phone.key, f.aid), f.aid, form.x);
            } catch (e) {
                setBusy(false);
                show('bad', P.errorText({ kind: 'crypto' }, P.hostOf(phone.server)), false);
                return settle();
            }
            pending = { message: sealed.message, b: st.v.send, btn: st.btn, text: '', key: key, rid: rid };
            return deliver();
        }
        if (!cv) return;
        var my = cv.gen, keep = st.sealed && st.sealedKey === key ? st.sealed : null;
        setBusyC(true);
        askSync(st);
        // Try again is Send answer itself, which sends the same message again
        var say = function (kind, text) { cShow(kind, text, false); };
        var went = await sendAct('answer', form.x, say, function () { return cv && cv.gen === my; }, function (res, sealed, failed) {
            if (!cv || cv.gen !== my) return;
            var p = res && res.payload;
            st.sealed = failed || !p ? sealed : null;
            st.sealedKey = key;
            if (p && p.ok) askSent(id, rid);
            onAckC(res, sealed, failed, null);
            if (asks[id] === st) askSync(st);
        }, keep);
        // nothing sealed (this browser's crypto): said already, and not busy
        if (!went && cv && cv.gen === my) { setBusyC(false); askSync(st); }
    }
    // what came of a look: the answer, a refusal the PC sent in its place,
    // gone past 3 hours, no inflate here, or nothing yet. A question the
    // chat waits on comes with it; sent alone (whole answers off), the
    // question is all there is to show. fresh: this reply is the PC's word
    // now (an alert's explicit read), so a question it no longer sends -
    // answered at the PC meanwhile - comes off the page
    function settlePanel(id, res, ask, noneState, fresh) {
        var p = panel(id), pl = res && res.payload;
        if (res && res.nodecomp) return drawPanel(id, 'nodecomp');
        if (pl && pl.kind === 'reply') {
            p.payload = pl;
            p.note = '';
            // a chat view drew its row's question already: an answer read
            // without one leaves it be
            if (pl.ask || fresh) drawAsk(askBoxOf(id), pl.ask || null);
            if (pl.ask && !(pl.parts && pl.parts.length)) { $(id).hidden = true; $(id).textContent = ''; return; }
            return drawPanel(id, 'shown');
        }
        if (pl && pl.kind === 'ack') return drawPanel(id, 'none', { text: pl.say || B.PANEL.none, ask: ask });
        if (res && res.gone) return drawPanel(id, 'gone', { ask: ask });
        return drawPanel(id, noneState || 'noanswer', { ask: ask });
    }
    // An alert's page: the whole answer, for done, needs input and failed
    // about a chat. With f=1 the PC sent it just before the push: looked for
    // at once and every 4 s for 30 s. Without, the button asks for it.
    function answerInit() {
        var id = 'answer', p = panel(id), my = ++p.gen;
        p.payload = null;
        p.full = false;
        p.note = '';
        $(id).hidden = true;
        drawAsk('ask', null);
        if (!f || f.jobless || B.FULL_EVENTS.indexOf(f.event) < 0) return;
        if (!B.canInflate()) return drawPanel(id, 'nodecomp');
        var ask = function () { askAlertRead(); };
        if (!f.full) return drawPanel(id, 'none', { ask: ask });
        drawPanel(id, 'loading');
        var since = f.at ? f.at - 120 : Math.floor(Date.now() / 1000) - 43200;
        waitDown(f.aid, since, 30000, ['reply'], 0, function () { return panel(id).gen === my && mode === 'alert'; }, function (res) {
            settlePanel(id, res, ask, 'none');
        });
    }
    // act read, bound to the alert: the PC sends the whole answer again
    async function askAlertRead() {
        if (mode !== 'alert' || !f) return;
        var id = 'answer', p = panel(id), my = ++p.gen, aid = f.aid;
        var live = function () { return panel(id).gen === my && mode === 'alert' && f && f.aid === aid; };
        drawPanel(id, 'asked');
        var sealed;
        try { sealed = await C.seal(await C.alertKey(phone.key, aid), aid, 'read', ''); } catch (e) { return drawPanel(id, 'none', { text: P.errorText({ kind: 'crypto' }, P.hostOf(phone.server)) }); }
        var sent = Date.now();
        var r = await post(P.postUrl(phone), sealed.message);
        if (!live()) return;
        if (!r.ok) return drawPanel(id, 'none', { text: P.errorText(r, P.hostOf(phone.server)), ask: askAlertRead });
        var since = f.at ? Math.min(f.at - 120, Math.floor(sent / 1000) - 60) : Math.floor(sent / 1000) - 43200;
        // the one gone before is no answer to this ask
        waitDown(aid, since, 60000, ['reply'], POLL_MS, live, function (res) {
            settlePanel(id, res && res.payload ? res : { nodecomp: res && res.nodecomp }, askAlertRead, 'noanswer', true);
        });
    }

    $('send').addEventListener('click', function () { if (spec) press(spec.send, $('send')); });
    $('again').addEventListener('click', function () { if (!busy) deliver(); });
    $('pair').addEventListener('click', function () { pairNow(); });
    $('text').addEventListener('input', function () {
        // an edited text is a new message: Try again would send the old one
        if (pending && pending.b.act === 'prompt' && pending.text !== $('text').value.trim()) {
            pending = null;
            $('again').hidden = true;
        }
        saveDraft();
        refresh();
    });
    $('text').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && spec && !$('send').disabled) {
            e.preventDefault();
            press(spec.send, $('send'));
        }
    });
    // a second alert's link opened in this same tab changes only the fragment
    window.addEventListener('hashchange', function () {
        if (location.hash.length <= 1) return;
        if (busy) { reinit = true; return; }
        init();
    });
    // the board and its chats
    $('toBoard').addEventListener('click', function () { if (phone && !busy) openBoard(true); });
    $('bBack').addEventListener('click', function () { init(); });
    $('bRefresh').addEventListener('click', function () { bd.started = Date.now(); bd.paused = false; drawNotes(); askBoard(); });
    $('bAgain').addEventListener('click', function () { $('bStatus').hidden = true; askBoard(); });
    $('bSearch').addEventListener('input', function () { if (bd.b) drawRows(); });
    $('bNew').addEventListener('click', function () { if (bd.b) openFolders(); });
    $('bStat').addEventListener('click', function () {
        var my = bd.gen;
        sendAct('status', {}, function (k, t) { bShow(k, t, false); }, function () { return my === bd.gen; }, function (res, sealed, failed) {
            if (my !== bd.gen || failed || mode !== 'board') return;
            var p = res && res.payload;
            if (p) bShow(p.ok ? 'ok' : 'bad', p.say || '', false);
            else bShow('bad', 'No answer from the PC.', false);
        });
    });
    $('cBack').addEventListener('click', function () {
        if (cv && cv.type === 'new') openFolders();
        else backToBoard();
    });
    $('cSearch').addEventListener('input', function () { if (cv && cv.type === 'folders') drawFolders(); });
    $('cText').addEventListener('input', function () {
        if (cv && cv.pending && cv.pending.text !== $('cText').value.trim()) { cv.pending = null; $('cAgain').hidden = true; }
        saveDraftC();
        refreshC();
    });
    $('cName').addEventListener('input', function () { refreshC(); });
    $('cSend').addEventListener('click', function () { sendC(); });
    $('cAgain').addEventListener('click', function () { if (cv && cv.pending && !cv.busy) sendC(); });
    if (typeof document.addEventListener === 'function') {
        // a board waiting for the page to be seen again asks once it is
        document.addEventListener('visibilitychange', function () {
            if (!hiddenPage() && mode === 'board' && bd.waitVisible) { bd.waitVisible = false; askBoard(); }
        });
    }
    init();
})();
</script>
</body>
</html>
