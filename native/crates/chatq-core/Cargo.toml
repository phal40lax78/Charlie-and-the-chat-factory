[package]
name = "chatq-core"
description = "The data/ contracts chatqd shares with the PowerShell side"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
chrono.workspace = true
base64.workspace = true
regex.workspace = true
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography"] }

# tests/reply_config_vectors.rs seals its throwaway secrets by DPAPI
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
