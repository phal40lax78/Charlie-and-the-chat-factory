# No vcruntime140.dll to load or ship (SPEC 3.3). Cargo finds this file from
# the current directory, not from --manifest-path: a build started from the
# repo root passes --config native/.cargo/config.toml to get it (SPEC 3.1).
# chatqd's build.rs refuses a release build that misses it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
