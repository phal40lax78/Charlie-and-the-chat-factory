[package]
name = "chatq-brain"
version = "0.4.0"
edition = "2021"
publish = false
description = "Detachable brain: a classifier service behind one localhost contract; Gemini, Claude Haiku or a local llama-server answers (see SPEC.md)"

# Standalone on purpose: NOT a member of native/Cargo.toml until SPEC.md section 8.
[workspace]

[lib]
name = "chatq_brain"
path = "src/lib.rs"

[[bin]]
name = "chatq-brain"
path = "src/main.rs"

# TEST-ONLY: a stand-in llama-server the contract tests launch through the
# real supervisor (tests/contract.rs). Never shipped: tools/package.py zips
# chatq-brain(.exe) alone.
[[bin]]
name = "fake-llama-server"
path = "tests/support/fake_llama_server.rs"
test = false
doc = false

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
getrandom = "0.2"
ctrlc = { version = "3", features = ["termination"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }
