# cargo deny check for the overlay's own workspace, run in native/overlay/:
# native/deny.toml's rules (SPEC 3.4), plus the three licences Slint's tree
# brings, which the user approved for M9 on 2026-10-21.
[graph]
# native/deny.toml's targets: the Mac ones too, so a crate the Mac build
# would pull is checked now (DEFERRED.md "The M9 spike on a Mac")
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
# the defaults: every advisory is an error, unmaintained ones included

[licenses]
# Zlib is foldhash's, under hashbrown. M9 adds BSL-1.0, ISC and
# BSD-2-Clause, which Slint's tree brings (TESTING.md S58); ISC comes
# from the Mac targets' crates.
# Slint's own crates are "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0
# OR LicenseRef-Slint-Software-3.0". The user allowed Royalty-free 2.0 on
# 2026-10-21, and Slint is taken under it alone. Its terms: desktop use is
# free; the attribution is the Slint badge on a public page, which the
# README carries among the badges at its top ("Made with Slint",
# licence section 2(b)); Slint's APIs are not exposed to the user.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Zlib", "BSL-1.0", "ISC", "BSD-2-Clause", "LicenseRef-Slint-Royalty-free-2.0"]
# chatq-overlay and chatq-core themselves (publish = false) carry none
private = { ignore = true }

[bans]
wildcards = "deny"
# the path dependencies: chatq-core and the vendored tray-icon
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
