# cargo about generate for the native panel: the licence notices that ship
# beside chatq-overlay.exe in the VSIX (payload/bin/<version>/
# x86_64-pc-windows-msvc/THIRD-PARTY-NOTICES.html, extension/build.js
# stageBin). Run in native/, as .github/workflows/test.yml does:
#
#     cargo about generate --manifest-path overlay/Cargo.toml -c overlay/about.toml overlay/about.hbs -o <file>
#
# accepted is deny.toml's allow list, in the order a choice is made: Slint's
# crates are "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
# LicenseRef-Slint-Software-3.0", and only Royalty-free 2.0 is taken (its
# attribution is the "Made with Slint" badge in both READMEs).
accepted = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Zlib", "BSL-1.0", "ISC", "BSD-2-Clause", "LicenseRef-Slint-Royalty-free-2.0"]
# the exe that ships: Windows x64 only
targets = ["x86_64-pc-windows-msvc"]
# what is not in the exe
ignore-build-dependencies = true
ignore-dev-dependencies = true
# chatq-overlay and chatq-core themselves (publish = false): this repo's MIT
# LICENSE, not a third party's
private = { ignore = true }

# Slint's crates carry their licence texts in LICENSES/, where cargo about
# does not look by itself: Royalty-free 2.0's named for each, as the 1.18.1
# crates have it. A new Slint whose text changed fails the checksum, which
# is the point: the text that ships is the one read. The file's licence is
# named "...-text", not the crate's own id, on purpose: cargo-about 0.9.2
# drops a clarified LicenseRef file whose id equals the crate's licence (its
# generate step's LicenseRef filter is inverted), and a different id gets
# the text through. Checked: all nine crates list under Royalty-free 2.0
# with its full text.

[slint.clarify]
license = "LicenseRef-Slint-Royalty-free-2.0"
[[slint.clarify.files]]
path = "LICENSES/LicenseRef-Slint-Royalty-free-2.0.md"
license = "LicenseRef-Slint-Royalty-free-2.0-text"
checksum = "5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe"

