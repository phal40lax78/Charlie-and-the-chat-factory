# The M9 spike (native/SPEC.md §8 "Memory, measured"): can one Slint
# process on the software renderer carry the overlay's window behaviours
# at 80 MB private or less after an hour? Throwaway, and kept out of the
# chatqd workspace: its own [workspace], built with --target-dir outside
# the repo, so VS Code's file watcher never sees target/.
[package]
name = "overlay-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
global-hotkey = "0.9.0"
serde_json = "1.0.154"
# unstable-winit-030: the attributes hook and the winit window (for its HWND).
# unstable-fontique-011: the Han fallback list (main.rs, han_fallbacks).
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030", "unstable-fontique-011"] }
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Same as chatqd's (native/Cargo.toml).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
